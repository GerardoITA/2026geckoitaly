 spa_empire_devout_catholisism:0 "Devout Christianism"
 spa_empire_devout_catholisism_desc:0 "Our faith is our sword and shield. It was only the grace of God that granted us our triumphs in the Reconquista. We must always show our devotion to the holy mother church."
 spa_empire_inter_caetera:0 "Inter Caetera"
 spa_empire_inter_caetera_desc:0 "On the 4th of May 1493 His Holiness granted us a papal bull granting us all lands west and south of a line 100 leagues west of the islands of the Azores. We will naturally enforce His Holiness's will."
 spa_empire_salamanca_scholars:0 "School of Salamanca"
 spa_empire_salamanca_scholars_desc:0 "Based in the University of Salamanca, the School's interests lie in fields as diverse as theology, economics, and political philosophy. As one of the leading schools of thought in the Catholic world, its entrenched presence in Castile ensures that our nation is always at the forefront of intellectual affairs."
 spa_empire_spanish_armada:0 "A Spanish Armada"
 spa_empire_spanish_armada_desc:0 "The power of Spain is as much in her fleet as in her feared tercios. We will ensure our navy wants for nothing so that should we ever need to do so we can send a mighty armada forth."
 spa_empire_spa_casa_de_contracion:0 "Casa de Contratación"
 spa_empire_spa_casa_de_contracion_desc:0 "We must extend the reach of the House of Trade of the Indies. Our colonial agents must have a presence in every part of the world to ensure the smooth functioning of our empire."
 spa_empire_siglo_de_oro:0 "Siglo de Oro"
 spa_empire_siglo_de_oro_desc:0 "A golden age is upon Spain, in painting, architecture, music and literature. Spain is the envy of the world. This will leave a legacy that will echo through time. Although I don't like the book about the man fighting the windmills, I just can't see that one being read by future generations."
 spa_empire_spa_cortes:0 "Rein in the Cortes"
 spa_empire_spa_cortes_desc:0 "Each constituent Kingdom in the Spanish realm has its own corte, an assembly of the most powerful elements of society in the region. There is often tension between the Crown and the Cortes over such issues as taxation and regional autonomy. We must rein in these institutions so that they primarily serve the Crown rather than their own interests."
 SPA_EMPIRE_ideas:0 "Spanish Imperial Ideas"
 SPA_EMPIRE_ideas_start:0 "Spanish Imperial Traditions"
 SPA_EMPIRE_ideas_bonus:0 "Spanish Imperial Ambition"
 fra_empire_fra_taille:0 "The Taille"
 fra_empire_fra_taille_desc:0 "The Taille was a land tax in France imposed during the Ancien Régime (pre-revolutionary period). It was levied on the French peasantry and was one of the main sources of revenue for the French monarchy. The amount of the tax was based on the value of the land, and was often resented by the peasantry, who felt that they were being unfairly taxed. The Taille was one of the factors that contributed to the outbreak of the French Revolution in 1789, as the French people's anger at the tax system helped fuel the revolutionary fervor."
 fra_empire_lessons_hundred_years_war:0 "Lessons of the Hundred Years' War"
 fra_empire_lessons_hundred_years_war_desc:0 "Constant warfare against the English crown has imbued our military personnel with remarkable experience in warfare. We may utilize this knowledge to further expand our influence and our domain."
 fra_empire_estates_general:0 "Estates General"
 fra_empire_estates_general_desc:0 "The estates general can claim to have existed since 1303, but gradually over time they have switched from being a council summoned by the King to being elected. This has given the estates general, and taxes levied by them, greater legitimacy."
 fra_empire_native_trading_principles:0 "Native Trading Principles"
 fra_empire_native_trading_principles_desc:0 "Most nations see natives as poor unfortunates who are failing to use God's creation properly and should be moved away. We see them as poor unfortunates who are failing to use God's creation properly but may someday dream of being French. This distinction is important."
 fra_empire_divine_right_to_rule:0 "Divine Right"
 fra_empire_divine_right_to_rule_desc:0 "Our heads of state have a mandate that supersedes all other internal authority in matters of administration and warfare. No other individual within our domain has the capacity to influence the divine right of our monarch."
 fra_empire_europes_first_standing_army:0 "Europe's First Standing Army"
 fra_empire_europes_first_standing_army_desc:0 "A ruler's strength only goes as far as their military capability. Forged in the fires of constant warfare and blessed by the hardships encountered in the battlefields of Europe, our army has become a disciplined force to be reckoned with."
 fra_empire_vauban_fortifications:0 "Vauban Fortifications"
 fra_empire_vauban_fortifications_desc:0 "This does not represent a radical departure in the design of fortification, the genius is in the placement of the fortresses. By taking maximum advantage of local terrain features the same fort can be much harder to take."
 FRA_EMPIRE_ideas:0 "French Imperial Ideas"
 FRA_EMPIRE_ideas_start:0 "French Imperial Traditions"
 FRA_EMPIRE_ideas_bonus:0 "French Imperial Ambition"
 fra_empire_rev_revolutionary_tribunal:0 "Equality Before the Law"
 fra_empire_rev_revolutionary_tribunal_desc:0 "Europe is the prey of bloodthirsty tyrants that maintain their subjects under the yoke of privileges. But when presented with the principle of equality before the law, allowing each man to be recognized as the equal to any other, they'll easily welcome this great Revolution that will guarantee their freedom and their rights."
 fra_empire_rev_elan:0 "Elan!"
 fra_empire_rev_elan_desc:0 "Cultivating the doctrine of attack is the centerpiece of army. Our men show such élan than we have clear edge on the battlefield."
 fra_empire_rev_mandats_territoriaux:0 "Franc Germinal"
 fra_empire_rev_mandats_territoriaux_desc:0 "In an effort for our great nation to cope with financial instability, we shall introduce new paper banknotes in an effort to combat hyperinflation and restabilize our economy."
 fra_empire_rev_liberty_egalite_fraternity:0 "Liberté, Égalité, Fraternité"
 fra_empire_rev_liberty_egalite_fraternity_desc:0 "With all men being equal under the law of your new state, people of other religions are allowed full participation in the state machinery, giving these provinces a boost."
 fra_empire_rev_jourdan_law:0 "Jourdan Law"
 fra_empire_rev_jourdan_law_desc:0 "A successful military legislative attempt, the Jourdan law forces all men between the ages of 20 and 25 liable for military service without spouses or offsprings. The poor and the destitute within our borders will be a great source of manpower to further our revolutionary ambitions across the old continent."
 fra_empire_rev_napoleonic_tactics:0 "Napoleonic Tactics"
 fra_empire_rev_napoleonic_tactics_desc:0 "A series of intense drilling exercises as well as renewed military tactics in the battlefield define our era. By utilizing new speedy maneuvers in the battlefield in conjunction with cavalry and artillery, our might will tower above our enemies."
 fra_empire_rev_european_ambitions:0 "European Ambitions"
 fra_empire_rev_european_ambitions_desc:0 "The old continent lays within our grasp. The monarchies and our foes around us are but minor obstacles in our dream to unite the continent under the astute guidance of the revolutionary ideals."
 FRA_EMPIRE_ideas_2:0 "French Revolutionary Imperial Ideas"
 FRA_EMPIRE_ideas_2_start:0 "French Revolutionary Imperial Traditions"
 FRA_EMPIRE_ideas_2_bonus:0 "French Revolutionary Imperial Ambition"
 gecko_spanish_empire_idea_improvements_tt:0 "\n§YNational Idea Improvements§!\n$SPA_ideas$ §Y->§! §G$SPA_EMPIRE_ideas$§!\n\n§YTraditions§!\n  - Morale of Armies: §W+15%§! §Y->§! §G+30%§!\n\n§Y$spanish_armada$§!\n  - Heavy Ship Combat Ability: §W0%§! §Y->§! §G+10%§!\n\nThese improvements apply if you adopt the new national ideas."
 gecko_french_empire_idea_improvements_tt:0 "\n§YNational Idea Improvements§!\nMilitary ideas gain §G+15% Artillery Combat Ability§!, §G+1 Land Leader Fire§! and §G+0.25 Yearly Army Tradition§!.\nCombat bonuses are added to $europes_first_standing_army$ (or $napoleonic_tactics$ for revolutionary ideas).\nYearly Army Tradition: $lessons_hundred_years_war$ §W+0.50§! §Y->§! §G+0.75§! (or $jourdan_law$ §W0§! §Y->§! §G+0.25§! for revolutionary ideas).\n\nThese improvements apply if you adopt the new national ideas."

 plc_greater_plc_prosperous_folwarks:0 "The Folwark System"
 plc_greater_plc_prosperous_folwarks_desc:0 "A nobleman's landholding in the Commonwealth is usually comprised of what we call a folwark. It is a large farm worked by various serfs to produce surpluses for trade that is both internal and external. So long as we can keep this system functional and perhaps reform the laws surrounding it over time, the folwark system will continue to contribute great amounts to our trade routes and our stockpiles."
 plc_greater_plc_tempered_by_neighbors:0 "Tempered by Neighbors"
 plc_greater_plc_tempered_by_neighbors_desc:0 "All around us there is conflict. Swedish people? Baltic conflicts. Hungarians? Border disputes. Teutons? Old grudges and lusts for land. Russians? Ambition for land on both sides. Time and time again we have been tested in combat since our borders in the east and west are hard to define beyond a hand-drawn map, but these times of war did not break down the Polish and Lithuanian people, it only made them stronger."
 plc_greater_plc_the_obrona_potoczna:0 "Obrona Potoczna"
 plc_greater_plc_the_obrona_potoczna_desc:0 "What we term a 'continuous defense' is really a standing army that is paid for by the monarch from their own pocket. They are stationed traditionally in troubled areas or places where the border with a neighbor is not clearly defined so that Commonwealth interests are not intruded upon. Over time, this military sector of ours is going to yield for us highly trained soldiers and skilled generals who know just how to deal with enemies of all types, whether they're of Polish, Lithuanian, Ukranian, or foreign descent."
 plc_greater_winged_hussars:0 "Winged Hussars"
 plc_greater_winged_hussars_desc:0 "The hussars were originally light cavalry troops used for scouting, but with the decline of the old feudal army we have switched over to professional regiments. The new heavier hussars will form the core of it. People will soon fear Poland's winged Hussars."
 plc_greater_plc_refine_our_golden_liberty:0 "Refinement of Golden Liberty"
 plc_greater_plc_refine_our_golden_liberty_desc:0 "Our political doctrine: 'Our State is a republic under the presidency of the king'. It is by this statement that we abide by and the following aspects: having an election of a king by all nobles, a Sejm, a Pacta Conventa, religious freedom, legal right to rebel against a king who has violated guaranteed freedoms, liberum veto, and forming an organization to force a common political aim. By keeping these aspects of our republic enshrined and also refining them with new laws and legislation as we go forth, the Commonwealth will never become outdated nor stagnant in its politics."
 plc_greater_pol_jagiellonian_university:0 "Jagiellonian University"
 plc_greater_pol_jagiellonian_university_desc:0 "Established in 1364, Krakow's Jagiellonian University is perhaps one of the greatest places in all of Europe! It has brought in, taught, and cultivated a variety of philosophical and scientific minds the likes of which Europe could almost never live without, let alone the Polish and Lithuanian people. Going forth, Jagiellonian University will continue to be one of the brightest points in our grand Commonwealth."
 plc_greater_pol_royal_guards:0 "The Polish Royal Guards"
 plc_greater_pol_royal_guards_desc:0 "Responsibly directly for the protection of the monarch and his family, the Polish Royal Guards are set to be the peak of Commonwealth power. Fitted with the best equipment we can obtain and trained in a variety of methods throughout their lives, the Polish Royal Guards will only embolden and harden our military in the future, especially our infantry, all whilst keeping the monarch and his family safe from harm."
 PLC_GREATER_ideas:0 "Greater Commonwealth Ideas"
 PLC_GREATER_ideas_start:0 "Greater Commonwealth Traditions"
 PLC_GREATER_ideas_bonus:0 "Greater Commonwealth Ambition"
 gecko_greater_commonwealth_idea_improvements_tt:0 "\n§YNational Idea Improvements§!\n$PLC_ideas$ §Y->§! §G$PLC_GREATER_ideas$§!\n\n§Y$winged_hussars$§!\n  - Additional Winged Hussars: §W0§! §Y->§! §G+40§!\n\n§Y$pol_royal_guards$§!\n  - Shock Damage Received: §W0%§! §Y->§! §G-10%§!\n\nThese improvements apply if you adopt the new national ideas."
 ukr_greater_mother_of_russian_cities:0 "The Mother of Russian States"
 ukr_greater_mother_of_russian_cities_desc:0 "Historically Kiev was the center of Rus' before the Mongol invasion. Many other Russian states attempted to fill the void after Kiev's fall: Moscow, Tver, Novgorod... But none of them could match Kiev's former glory.\nUnlike these northern upstarts, however, we are true heirs of the Kievan legacy, our people walk the same land as our Kievan ancestors and our capital aspires to the same greatness. Our claims must be respected!"
 ukr_greater_international_influences:0 "Foreign Influences"
 ukr_greater_international_influences_desc:0 "Russian lands were historically divided among several nations, among them Poles, Lithuanians, Tatars and Hungarians. As such, our citizens come from multiple cultures and follow different religions. To be a unified state we must respect their faith."
 ukr_greater_zaporizhian_cossacs:0 "Zaporozhian Cossacks"
 ukr_greater_zaporizhian_cossacs_desc:0 "The Cossack caste originated in the Zaporozhian steppes and quickly became the strongest military power in that region. Now they are a part of the Rusyn state and thus no longer need to fight for survival. As such we can reform them into the backbone of our new army."
 ukr_greater_east_and_west:0 "East and West"
 ukr_greater_east_and_west_desc:0 "Our geographic location between the states of the east and the west provided our merchants with an opportunity to be the middle men in the extremely lucrative trade routes of the region."
 ukr_greater_legacy_of_ancient_rus:0 "Heritage of the Old Rus'"
 ukr_greater_legacy_of_ancient_rus_desc:0 "The social systems of the old Rus' often varied greatly from the Muscovite despotism. In Ruthenia more freedom was given to the peasants, state serfdom was not enforced, and the nobility did serve the state instead of exploiting it. It helped to transform Ruthenia into a modern Kievan Rus'."
 ukr_greater_reuniting_rus:0 "Reuniting Rus'"
 ukr_greater_reuniting_rus_desc:0 "Kievan Rus' has been reborn in Ruthenian lands, but many people of the old Rus live under foreign rule or in small principalities. Rus must be reunited!"
 ukr_greater_birth_of_russian_orthodoxy:0 "Birth of Russian Orthodoxy"
 ukr_greater_birth_of_russian_orthodoxy_desc:0 "The early Rus' suffered from various religious troubles. In the year 988 Vladimir the Great was baptized after the capture of Korsun. Upon returning to Kiev he ordered the mass baptism of the citizenry in the Dnieper river, marking the first step in the Christianization of Rus'."
 UKR_GREATER_ideas:0 "Greater Ruthenia Ideas"
 UKR_GREATER_ideas_start:0 "Greater Ruthenia Traditions"
 UKR_GREATER_ideas_bonus:0 "Greater Ruthenia Ambition"
