l_english:
 RUS_EMPIRE_ideas:0 "Russian Imperial Ideas"
 RUS_EMPIRE_ideas_start:0 "Russian Imperial Traditions"
 RUS_EMPIRE_ideas_bonus:0 "Russian Imperial Ambition"
 rus_empire_land_of_the_rus:0 "Land of the Rus"
 rus_empire_land_of_the_rus_desc:0 "The Rus together will be a force to reckon with."
 rus_empire_siberian_frontier:0 "Siberian Frontier"
 rus_empire_siberian_frontier_desc:0 "The distant wastes of Siberia call to us. We must clear a way there and let our cossacks go forth and bring land for the Russian people."
 rus_empire_russian_artillery_yard:0 "Russian Artillery Yard"
 rus_empire_russian_artillery_yard_desc:0 "Superior firepower is what determines the sieges of today as well as the pitched battles of tomorrow. We must build a state-of-the-art artillery yard in the heart of our country, to ensure our armies are never without cannons nor ammunition."
 rus_empire_life_long_conscription:0 "Life-Long Conscription"
 rus_empire_life_long_conscription_desc:0 "In order to feed our ever-growing armies we should expand the terms of military service so that it becomes a lifelong commitment. This will offer social mobility to those that would otherwise lead lives in lesser occupations, and it will give us a reliable source of soldiers for our imperial endeavors."
 rus_empire_abolish_the_mestnichestvo:0 "Abolish the Mestnichestvo"
 rus_empire_abolish_the_mestnichestvo_desc:0 "The Mestnichestvo was an ancient system that states that state jobs should be offered to persons based upon how ancient their lineage was. This was problematic because this did not take into account the suitability of the candidate. The abolishment of this system will improve state bureaucracy by allowing appointment by merit."
 rus_empire_table_of_ranks:0 "The Table of Ranks"
 rus_empire_table_of_ranks_desc:0 "The abolishment of the Mestnichestvo was the first move to make the state bureaucracy more meritocratic. The table of ranks codified this and made service and promotion in the army conditional on service in lower ranks."
 rus_empire_curriculum_of_the_cadet_corps:0 "Broaden the curriculum of the Cadet Corps"
 rus_empire_curriculum_of_the_cadet_corps_desc:0 "We have more cadets than there are officer places in our army, we should use the cadet corps to create not just potential officers, but scientists and engineers as well."
 GBR_EMPIRE_ideas:0 "British Imperial Ideas"
 GBR_EMPIRE_ideas_start:0 "British Imperial Traditions"
 GBR_EMPIRE_ideas_bonus:0 "British Imperial Ambition"
 gbr_empire_acts_of_union:0 "The Acts of Union"
 gbr_empire_acts_of_union_desc:0 "The Acts of Union constitutionally combine the nations of England and Scotland into one. From a single national Parliament, the entire nation shall be ruled under the same set of laws and ordinances, with a common military and economy."
 gbr_empire_city_upon_a_hill:0 "City Upon a Hill"
 gbr_empire_city_upon_a_hill_desc:0 "We are entered into a covenant with God to settle the New World. We shall be a City upon a hill, with the eyes of the world upon us, a model to all future colonies."
 gbr_empire_the_british_parliament:0 "Parliament of Great Britain"
 gbr_empire_the_british_parliament_desc:0 "We have a long history of parliamentarism in our country, and with the creation of the Parliament of Great Britain it is only natural that we continue the traditions of the English and Scottish parliaments."
 gbr_empire_the_royal_society:0 "The Royal Society"
 gbr_empire_the_royal_society_desc:0 "The Royal Society brings together the greatest scientific minds in the nation and drives them to even greater heights of understanding in the many fields of natural philosophy. As a world-class institution, it will lead Great Britain into a new era of thought and experimentation."
 gbr_empire_reform_of_comission_buying:0 "Reform of Commission Buying"
 gbr_empire_reform_of_comission_buying_desc:0 "The Grand old Duke of York, appointed head of the army in 1795, instituted a far reaching set of reforms on the British army. He improved the lot of the common soldiers and more importantly laid down strict conditions on the buying of promotions. Officers from now on would have to serve a minimum amount of time at the previous rank before they could buy the next one. This lead to officers who actually had a rough idea about what they were doing."
 gbr_empire_british_industrialization:0 "Early Industrialization"
 gbr_empire_british_industrialization_desc:0 "Rapid advances in technology are creating possibilities never before dreamt of. People flock to the cities to work in new, highly efficient factories outfitted with astonishing modern machinery. Britain must be at the heart of this industrial revolution, as any nation that fails to modernize will be swept away by those that do."
 gbr_empire_britanna_rules_the_waves:0 "Britannia Rules the Waves"
 gbr_empire_britanna_rules_the_waves_desc:0 "Rule Britannia!\nBritannia rule the waves.\nBritons never, never, never shall be slaves."
 PER_EMPIRE_ideas:0 "Achaemenid Imperial Ideas"
 PER_EMPIRE_ideas_start:0 "Achaemenid Imperial Traditions"
 PER_EMPIRE_ideas_bonus:0 "Achaemenid Imperial Ambition"
 per_empire_the_qizilbash:0 "The Qizilbash"
 per_empire_the_qizilbash_desc:0 "The Qizilbash, or Red Heads, are a Shiite military movement ready to fight and die for their religious convictions. They are ready to support our state and could form the nucleolus of our army."
 per_empire_persian_rug_production:0 "Encourage Persian Rug Production"
 per_empire_persian_rug_production_desc:0 "Persia has long been famous for its rug and carpet manufacture. However, when the Mongols swept through our lands there was great destruction. For Persia to recover we must recover our economic strength as well. It is time to encourage the recovery of our ancient strengths."
 per_empire_the_ghulams:0 "Found the Ghilman"
 per_empire_the_ghulams_desc:0 "Previously our army has been heavily dependent on Feudal levies (Qizilbash) who have proved to be more to loyal themselves than the throne. We will found a standing army of professional infantry and cavalry, whose loyalty is to the Shah first, to defend the country."
 per_empire_improved_silk_road:0 "Improve the Silk Road"
 per_empire_improved_silk_road_desc:0 "A system of upgrades to roads and bridges, a system of guards to protect the roads (for a small tax) and a chain of Caravanserai to provide rest stops. All help the merchants as they traverse the silk road and also provide increased revenues for the state."
 per_empire_encouraged_art:0 "Encourage Art"
 per_empire_encouraged_art_desc:0 "There is a huge cultural tradition of Art in the lands of the Persians. From a government perspective this is stuff that people want to buy. The encouragement of art will give our merchants more things to sell abroad boosting the wealth of our nation."
 per_empire_promotion_of_irrigation:0 "Promotion of Irrigation"
 per_empire_promotion_of_irrigation_desc:0 "If we encourage agriculture, we will increase our population so we will have more manpower for our army "
 per_empire_increased_crown_lands:0 "Increase the Crown Lands"
 per_empire_increased_crown_lands_desc:0 "The large percentage of our income comes from the revenues from agriculture. Over the years the crown lands have been handed over to loyal followers as rewards. It is time to start to claw back these lands in order to ensure we can remain strong."
 ARB_EMPIRE_ideas:0 "Rashidun Caliphal Ideas"
 ARB_EMPIRE_ideas_start:0 "Rashidun Caliphal Traditions"
 ARB_EMPIRE_ideas_bonus:0 "Rashidun Caliphal Ambition"
 arb_empire_1:0 "Indian Ocean Trade"
 arb_empire_1_desc:0 "Our sailors have been to the Swahili coasts and as far as Hindustan and even the Malay lands. We can play a critical role in the flow of goods between these wealthy regions."
 arb_empire_3:0 "Bedouin Raiders"
 arb_empire_3_desc:0 "Since before the days of the Prophet, Bedouins have been experts at the art of the raid. An army may march on its stomach, but it won't march far when our raiders take the food right out of the army's mouth through rapid hit and run seizures of their supply lines. Pull back and let the raiders do their work and watch as the invader dies of thirst."
 arb_empire_5:0 "Unite the Tribes"
 arb_empire_5_desc:0 "Our loosely-organized way of handling our affairs has its upsides. Perhaps we could allow the tribes to continue providing for the upkeep of their own soldiers and horsemen while bringing them together in a more modern military pointed outwards rather than within?"
 arb_empire_2:0 "Arabian Horsemanship"
 arb_empire_2_desc:0 "The man who rides for pleasure or military occupation has no idea what true horsemanship is. The Bedouin rides to trade, to eat, to live. It should surprise no one that, in addition to the finest horses, Arabia produces the finest cavalrymen."
 arb_empire_4:0 "Spreading the Prophet's Word"
 arb_empire_4_desc:0 "There is no god but Allah, Muhammad is His messenger. By now, all men should know these holy words, but a shocking amount still dwell in the pitiable state of ignorance of Islam. Our missionaries are ready to spread the words of the Prophet."
 arb_empire_6:0 "Bedouin Traders"
 arb_empire_6_desc:0 "There aren't many sharply-delineated man-made borders in Arabia, and even if there were, the Bedouin would ignore them. Though the Bedouin nomadic journeys through our lands and into others has risks, it also facilitates easy access to trade through the entire region, as Bedouin nomads know no import tariffs or trade embargoes."
 arb_empire_7:0 "Arabia"
 arb_empire_7_desc:0 "Although Arabia has many different clans, tribes and countries, all share in the use of the Arabic language, it forms the unifying feature of all Arabs. Under a strong leadership we can unite all Arabian lands under a single flag and one ruler."
