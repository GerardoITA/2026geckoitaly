l_english:
 gecko_proclaim_russian_empire_title:0 "Proclaim the Russian Empire"
 gecko_proclaim_russian_empire_desc:0 "Let the name of our realm reflect the extent of Russian power and proclaim the Russian Empire."
 gecko_russian_empire_territory_tt:0 "All provinces in the following regions and areas must be directly owned and cored by us:\n§YRegions:§! Ruthenia, Russia, Ural, Pontic Steppe\nCaucasia, West Siberia, East Siberia\n§YSiberian area:§! Tannu Uriankhai\n§YCentral Asian areas:§! Khiva, Transoxiana, Samarkand, Khuttalan, Merv, Transcaspia\nNogai, Kazakhstan, Balchash, Ferghana, Jetysuu\nArys, Lower Yik, Syr Darya, Kyzylkum\n§YDanubian area:§! Moldavia\n§YBaltic areas:§! Samogitia, Aukstaitija, Curonia, Livonia, Estonia\n§YFinnish areas:§! Nyland, Inner Finland, Finland, Ostrobothnia\n§YPolish area:§! Mazovia"
 GECKO_RUSSIAN_EMPIRE:0 "Russian Empire"
 GECKO_RUSSIAN_EMPIRE_ADJ:0 "Russian"
 gecko_proclaim_british_empire_title:0 "Proclaim the British Empire"
 gecko_proclaim_british_empire_desc:0 "Let the name of our realm reflect the extent of British power and proclaim the British Empire."
 gecko_british_empire_territory_tt:0 "All provinces in the following regions and areas must be owned by us or our subjects:\n§YRegions:§! South Africa, East Africa, Egypt, Canada\nHudson Bay, Australia, Burma, Bengal\nHindustan, Western India, Deccan, Coromandel\nBritain\n§YEast African areas:§! Kenya, Tanzania\n§YLevantine area:§! Palestine\n§YSouth-East Asian areas:§! Johor, Malacca, Malaya, Brunei\n§YWest African areas:§! Benin, Lower Niger\n§YGulf areas:§! Pirate Coast, Oman, Muscat\n§YSouth Arabian areas:§! Dhofar, Mahra, Hadramut, Lower Yemen, Upper Yemen, Tihama al-Yemen, Asir"
 GECKO_BRITISH_EMPIRE:0 "British Empire"
 GECKO_BRITISH_EMPIRE_ADJ:0 "British"
 gecko_proclaim_persian_empire_title:0 "Proclaim the Achaemenid Empire"
 gecko_proclaim_persian_empire_desc:0 "Restore the dominion of the Achaemenid kings and proclaim the Achaemenid Empire stretching across the lands of their ancient realm."
 gecko_persian_empire_territory_tt:0 "All provinces in the following regions and areas must be directly owned and cored by us:\n§YRegions:§! Persia, Khorasan, Mashriq, Anatolia\nEgypt\n§YCaucasian areas:§! Shirvan, Armenia, Samtskhe, Imereti, Kartli-Kakheti\n§YBalkan area:§! Thrace"
 GECKO_PERSIAN_EMPIRE:0 "Achaemenid Empire"
 GECKO_PERSIAN_EMPIRE_ADJ:0 "Achaemenid"
 gecko_proclaim_rashidun_caliphate_title:0 "Proclaim the Rashidun Caliphate"
 gecko_proclaim_rashidun_caliphate_desc:0 "Restore the dominion of the Rightly Guided Caliphs and proclaim the Rashidun Caliphate."
 gecko_rashidun_caliphate_territory_tt:0 "All provinces in the following regions and areas must be directly owned and cored by us:\n§YRegions:§! Arabia, Mashriq, Persia, Egypt, Khorasan\n§YAnatolian areas:§! Kurdistan, Dulkadir, Akdeniz, Karaman, Rum"
 GECKO_RASHIDUN_CALIPHATE:0 "Rashidun Caliphate"
 GECKO_RASHIDUN_CALIPHATE_ADJ:0 "Rashidun"
 gecko_proclaim_umayyad_caliphate_title:0 "Proclaim the Umayyad Caliphate"
 gecko_proclaim_umayyad_caliphate_desc:0 "Unite Egypt, the Maghreb and Iberia under our rule and proclaim the Umayyad Caliphate."
 gecko_umayyad_caliphate_territory_tt:0 "All provinces in the following regions must be directly owned and cored by us:\n§YRegions:§! Egypt, Maghreb, Iberia"
 GECKO_UMAYYAD_CALIPHATE:0 "Umayyad Caliphate"
 GECKO_UMAYYAD_CALIPHATE_ADJ:0 "Umayyad"
 # Compatibility aliases for the previous proclamation identifiers.
 gecko_proclaim_umayyad_empire_title:0 "$gecko_proclaim_rashidun_caliphate_title$"
 gecko_proclaim_umayyad_empire_desc:0 "$gecko_proclaim_rashidun_caliphate_desc$"
 gecko_umayyad_empire_territory_tt:0 "$gecko_rashidun_caliphate_territory_tt$"
 GECKO_UMAYYAD_EMPIRE:0 "$GECKO_RASHIDUN_CALIPHATE$"
 GECKO_UMAYYAD_EMPIRE_ADJ:0 "$GECKO_RASHIDUN_CALIPHATE_ADJ$"
 gecko_proclaim_western_umayyad_empire_title:0 "$gecko_proclaim_umayyad_caliphate_title$"
 gecko_proclaim_western_umayyad_empire_desc:0 "$gecko_proclaim_umayyad_caliphate_desc$"
 gecko_western_umayyad_empire_territory_tt:0 "$gecko_umayyad_caliphate_territory_tt$"
 GECKO_WESTERN_UMAYYAD_EMPIRE:0 "$GECKO_UMAYYAD_CALIPHATE$"
 GECKO_WESTERN_UMAYYAD_EMPIRE_ADJ:0 "$GECKO_UMAYYAD_CALIPHATE_ADJ$"
 gecko_proclaim_spanish_empire_title:0 "Proclaim the Spanish Empire"
 gecko_proclaim_spanish_empire_desc:0 "Unite our Iberian, Italian and Maghrebi dominions and proclaim the Spanish Empire."
 gecko_spanish_empire_territory_tt:0 "All provinces in the following regions and areas must be directly owned and cored by us:\n§YRegions:§! Iberia (excluding Portugal, the Azores and Madeira), Maghreb\n§YItalian areas:§! Sardinia, Eastern Sicily, Western Sicily, Naples, Apulia, Calabria"
 GECKO_SPANISH_EMPIRE:0 "Spanish Empire"
 GECKO_SPANISH_EMPIRE_ADJ:0 "Spanish"
 gecko_benelux_integration:0 "Benelux Integration"
 desc_gecko_benelux_integration:0 "The integration of the Low Countries strengthens our administration and subject revenues."
 gecko_proclaim_greater_commonwealth_title:0 "Proclaim the Greater Commonwealth"
 gecko_proclaim_greater_commonwealth_desc:0 "Proclaim a Greater Commonwealth, defended by our royal guards and winged hussars."
 GECKO_GREATER_COMMONWEALTH:0 "Greater Commonwealth"
 GECKO_GREATER_COMMONWEALTH_ADJ:0 "Commonwealth"
 gecko_proclaim_austrian_primacy_title:0 "Proclaim Austrian Primacy"
 gecko_proclaim_austrian_primacy_desc:0 "Assert Austrian primacy through a stronger imperial army."
 gecko_austrian_primacy:0 "Austrian Primacy"
 desc_gecko_austrian_primacy:0 "Our military primacy rests upon the strength of our infantry and artillery."
 gecko_austrian_primacy_territory_tt:0 "All provinces in the following regions and areas must be directly owned and cored by us:\n§YRegion:§! Carpathia (excluding Moldavia)\n§YBalkan areas:§! Serbia, Rascia, Bosnia, Slavonia, Dalmatia, Croatia\n§YBohemian areas:§! Moravia, Bohemia, Hradecko, Erzgebirge\n§YAustrian areas:§! Austria Proper, Inner Austria, Outer Austria, Krain, Tirol, Carniola\n§YItalian areas:§! Venetia, Po Valley\n§YPolish areas:§! Sandomierz, Malopolska\n§YAdditional provinces:§! Cremona (1862), Milano (104), Como (4740), Salzburg (76), Coburg (4716)"
 gecko_greater_commonwealth_territory_tt:0 "All provinces in the following regions and areas must be directly owned and cored by us:\n§YRegions:§! Baltic, Poland, Ruthenia\n§YAreas:§! Moldavia, Odessa, Zaporozhia, Yedisan"
 gecko_proclaim_greater_ruthenia_title:0 "Proclaim Greater Ruthenia"
 gecko_proclaim_greater_ruthenia_desc:0 "Unite the lands of our expanded realm and proclaim Greater Ruthenia."
 GECKO_GREATER_RUTHENIA:0 "Greater Ruthenia"
 GECKO_GREATER_RUTHENIA_ADJ:0 "Ruthenian"
 gecko_proclaim_dutch_empire_title:0 "Proclaim the Dutch Empire"
 gecko_proclaim_dutch_empire_desc:0 "Establish Dutch power across the Low Countries, southern Africa and the trading ports and islands of Asia."
 gecko_dutch_empire_territory_tt:0 "All provinces in the following regions and areas must be owned by us or our subjects:\n§YRegions:§! Low Countries, Malacca, Indonesia, Moluccas\n§YAreas:§! Cape of Good Hope, Xhosa, North Lanka, South Lanka, Malabar, Madura, Tanjore"
 gecko_dutch_empire:0 "Dutch Empire"
 desc_gecko_dutch_empire:0 "Our overseas empire strengthens military discipline, naval morale and trade efficiency."
