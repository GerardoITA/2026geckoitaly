 gecko_proclaim_persian_empire_title:0 "Proclaim the Persian Empire"
 gecko_proclaim_persian_empire_desc:0 "Restore the dominion of the Achaemenid kings and proclaim a Persian Empire stretching across the lands of their ancient realm."
 gecko_persian_empire_territory_tt:0 "All provinces in the following regions and areas must be owned by us or our subjects:\n§YRegions:§! Persia, Khorasan, Mashriq, Anatolia\nEgypt\n§YCaucasian areas:§! Shirvan, Armenia, Samtskhe, Imereti, Kartli-Kakheti\n§YBalkan area:§! Thrace"
