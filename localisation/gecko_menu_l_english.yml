 gecko_menu_page_8_heading_2:0 "§YSplendid Court§!"
 gecko_menu_page_8_body_2:0 "During the Age of Discovery, a human non-colonial country at peace with at least one level-3 advisor receives"
 gecko_menu_page_8_body_2_line_1:0 "§G-10% advisor cost§! and §G-5% development cost§!. Losing the conditions removes the triggered benefit."
 gecko_menu_page_13_body_1_line_2:0 "§Y10-year country cooldown§!."
