 gecko_menu_page_58_title:0 "§YDecentralization: the final reforms§!"
 gecko_menu_page_58_lead:0 "The late left branch supports development and a distributed military network."
 gecko_menu_page_58_heading_0:0 "§YGeteilte Macht§!"
 gecko_menu_page_58_body_0:0 "Emperor: §G-10% advisor cost§!. All imperial countries: §G-5% technology cost§!. Imperial provinces: §G-2.5%§!"
 gecko_menu_page_58_body_0_line_1:0 "§Gdevelopment cost§!."
 gecko_menu_page_58_heading_1:0 "§YReichskrieg§!"
 gecko_menu_page_58_body_1:0 "Emperor: §G+10% income from vassals and +50% vassal force-limit contribution§!. All imperial countries: §G+2.5%§!"
 gecko_menu_page_58_body_1_line_1:0 "§Garmy morale§!. Imperial provinces: §G+25% manpower§!."
 gecko_menu_page_58_heading_2:0 "§YDefense of the Empire§!"
 gecko_menu_page_58_body_2:0 "After Reichskrieg, the Emperor and electors gain §G-100% war taxes cost§! while at war with a country outside the"
 gecko_menu_page_58_body_2_line_1:0 "Empire."
 gecko_menu_page_58_number:0 "HRE • 6 / 8"
 gecko_menu_page_59_title:0 "§YCentralization: imperial administration§!"
 gecko_menu_page_59_lead:0 "The right branch concentrates its major administrative benefits in the Emperor."
 gecko_menu_page_59_heading_0:0 "§YReform the Hofgericht§!"
 gecko_menu_page_59_body_0:0 "Emperor: §G-10% construction cost§!. This first centralizing reform excludes the decentralizing branch."
 gecko_menu_page_59_heading_1:0 "§YCurtail the Imperial Estates§!"
 gecko_menu_page_59_body_1:0 "Emperor: §G-5% all power costs§!."
 gecko_menu_page_59_heading_2:0 "§YProclaim Erbkaisertum§!"
 gecko_menu_page_59_body_2:0 "Emperor: §G+25% Imperial Authority growth, +20% manpower recovery and +4 diplomatic relations§!."
 gecko_menu_page_59_number:0 "HRE • 7 / 8"
 gecko_menu_page_60_title:0 "§YCentralization: the final reforms§!"
 gecko_menu_page_60_lead:0 "Use the active Gecko rewards when comparing the two branches."
 gecko_menu_page_60_heading_0:0 "§YRevoke The Privilegia§!"
 gecko_menu_page_60_body_0:0 "Emperor: §G-10% advisor cost§!. Imperial members gain §G-10% stability cost§!."
 gecko_menu_page_60_heading_1:0 "§YRenovatio Imperii§!"
 gecko_menu_page_60_body_1:0 "Emperor: §G+10% army morale§!."
 gecko_menu_page_60_heading_2:0 "§YGecko changes the late rewards§!"
 gecko_menu_page_60_body_2:0 "Hereditary succession, automatic mass vassalization and imperial unification are disabled in these reform"
 gecko_menu_page_60_body_2_line_1:0 "definitions. Plan the centralization route around its administrative, recovery and morale bonuses."
 gecko_menu_page_60_number:0 "HRE • 8 / 8"
