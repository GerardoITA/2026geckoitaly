 # Retired localisation keys, retained for compatibility.
 gecko_menu_page_5_body_0_line_2:0 "been removed."
 gecko_menu_page_5_body_1_line_2:0 "land interactions."
 gecko_menu_page_35_body_1_line_1:0 "build combinations than the familiar vanilla openings. Choose around your campaign plan and policy"
 gecko_menu_page_35_body_1_line_2:0 "synergies."
 gecko_menu_page_37_body_0_line_2:0 "raise the flat bonus to keep it relevant."
 gecko_menu_page_37_heading_2:0 "§YTechnology thresholds§!"
 gecko_menu_page_37_body_2:0 "Many tiers change at §YMIL 15 and 22§!. Black Chamber changes at §YMIL 16 and 22§!, raising flat artillery fire"
 gecko_menu_page_37_body_2_line_1:0 "from §G+0.4 to +1.0 to +1.5§!. Review the policy panel after reaching a threshold."
 gecko_menu_page_38_body_2_line_2:0 "expansions are more rewarding than spreading single expansions widely."
 gecko_menu_page_38_heading_3:0 "§YImproving capacity efficiency§!"
 gecko_menu_page_38_body_3:0 "Including the ordinary expansion costs, §Y1 / 2 / 3 expansions§! add §Y+35 / +55 / +75 flat local governing cost§!,"
 gecko_menu_page_38_body_3_line_1:0 "while their net local governing-cost modifier becomes §G-5 / -10 / -15%§!. The first tier pays the largest upfront"
 gecko_menu_page_38_body_3_line_2:0 "premium; later tiers add less flat cost and stronger percentage relief. Actual capacity use also depends on the"
 gecko_menu_page_38_body_3_line_3:0 "province and other modifiers."
 gecko_menu_page_39_body_0_line_2:0 "combined discount is §G-4.5 / -10.5 / -22.5%§!."
 gecko_menu_page_39_body_1_line_2:0 "the grain, livestock, naval-supplies and cloth production hubs."
 gecko_menu_page_40_body_2_line_2:0 "Imperial Administration event bonus."
 gecko_menu_page_42_body_0_line_2:0 "its usual §Y500 total ships§!. Reduced-requirement countries still need the 300 heavies."
 gecko_menu_page_42_heading_2:0 "§YEconomic: construction and capacity§!"
 gecko_menu_page_42_body_2:0 "At full strength, Gecko gives §G+15% goods produced, +10% governing capacity and -15% construction cost§!,"
 gecko_menu_page_42_body_2_line_1:0 "plus the shared power-cost reduction. Vanilla instead offers +25% goods, +20% capacity, +10% mercenary"
 gecko_menu_page_42_body_2_line_2:0 "discipline and -20% minimum territory autonomy. The mercenary-discipline and territory-autonomy rewards"
 gecko_menu_page_42_body_2_line_3:0 "are replaced."
 gecko_menu_page_43_body_1_line_2:0 "power adds §G+15% force limit, +10% army morale§! and the shared power-cost reduction."
 gecko_menu_page_48_body_0_line_2:0 "especially dangerous."
 gecko_menu_page_48_body_1_line_2:0 "passed reforms are retained."
 gecko_menu_page_48_heading_2:0 "§YHorde Unity§!"
 gecko_menu_page_48_body_2:0 "This system displays meritocracy as §YHorde Unity§!. With §YMandate of Heaven§!, the existing formation setup"
 gecko_menu_page_48_body_2_line_1:0 "enables it and sets it to §Y100§! for the Great Khan. Government reforms determine access to this resource."
 gecko_menu_page_50_body_0_line_1:0 "than in vanilla, so a reform can usually pass soon after you reach 60. The §Yleft branch decentralizes§! and the"
 gecko_menu_page_50_body_0_line_2:0 "§Yright branch centralizes§!; choosing one excludes the other."
 gecko_menu_page_52_heading_3:0 "§YVII - Ewiger Landfriede§!"
 gecko_menu_page_52_body_3:0 "Emperor: §G+5% army morale and +0.5 yearly prestige§!. All imperial countries: §G-5% technology cost§!. Imperial"
 gecko_menu_page_52_body_3_line_1:0 "provinces: §G+10% institution spread§!."
 gecko_menu_page_54_body_0_line_1:0 "§Gdevelopment cost§!."
 gecko_menu_page_54_body_1_line_1:0 "§Garmy morale§!. Imperial provinces: §G+25% manpower§!."
 gecko_menu_page_54_body_2_line_1:0 "Empire."
 gecko_menu_page_56_body_2_line_1:0 "definitions. Plan the centralization route around its administrative, recovery and morale bonuses."
 gecko_menu_page_32_heading_1:0 "§YTributary payments§!"
 gecko_menu_page_32_body_1:0 "Annual monarch-point tribute has a global maximum of §Y4 points§!. The ordinary cash-tribute base rate is §Y0§!,"
 gecko_menu_page_32_body_1_line_1:0 "while manpower tribute uses its own rate. Check which tribute types your current subject relationship can"
 gecko_menu_page_32_body_1_line_2:0 "actually provide."
 gecko_menu_page_20_body_1_line_2:0 "discipline and lower manpower and maintenance use."
 gecko_menu_page_24_heading_2:0 "§YAvoid emergency debt spirals§!"
 gecko_menu_page_24_body_2:0 "Each point of inflation gives §R-1% mercenary discipline and -2% mercenary force-limit modifier§!. During war,"
 gecko_menu_page_24_body_2_line_1:0 "falling below §Y10% manpower§! adds another §R-5% mercenary discipline§!. Loans also reduce mercenary capacity:"
 gecko_menu_page_24_body_2_line_2:0 "treasury and reserves both matter."
 gecko_menu_page_27_heading_2:0 "§YClaims and diplomats§!"
 gecko_menu_page_27_body_2:0 "Fabricating a claim starts at §Y10 spy-network points§!, with a §Y0.25 per-claim cost modifier§!. Rival changes use a"
 gecko_menu_page_27_body_2_line_1:0 "§Y5-year§! interval. These are base rules; national and idea modifiers may alter the final action."
 gecko_menu_page_28_body_0_line_2:0 "ownership."
 gecko_menu_page_28_body_1_line_2:0 "full maintenance and at least 30% army force-limit usage."
 gecko_menu_page_28_body_2_line_2:0 "treasury amount alone does not guarantee activation."
 gecko_menu_page_31_body_0_line_2:0 "the idea change when promoting a subject."
 gecko_menu_page_32_heading_2:0 ""
 gecko_menu_page_32_body_2:0 ""
 gecko_menu_page_32_body_2_line_1:0 ""
 gecko_menu_page_32_body_2_line_2:0 ""
 gecko_menu_page_36_body_0_line_2:0 "raise the flat bonus to keep it relevant."
 gecko_menu_page_37_body_2_line_2:0 "expansions are more rewarding than spreading single expansions widely."
 gecko_menu_page_37_heading_3:0 "§YImproving capacity efficiency§!"
 gecko_menu_page_37_body_3:0 "Including the ordinary expansion costs, §Y1 / 2 / 3 expansions§! add §Y+35 / +55 / +75 flat local governing cost§!,"
 gecko_menu_page_37_body_3_line_1:0 "while their net local governing-cost modifier becomes §G-5 / -10 / -15%§!. The first tier pays the largest upfront"
 gecko_menu_page_37_body_3_line_2:0 "premium; later tiers add less flat cost and stronger percentage relief. Actual capacity use also depends on the"
 gecko_menu_page_37_body_3_line_3:0 "province and other modifiers."
 gecko_menu_page_38_body_1_line_2:0 "the grain, livestock, naval-supplies and cloth production hubs."
 gecko_menu_page_41_body_2_line_3:0 "are replaced."
 gecko_menu_page_47_heading_2:0 "§YHoly sites and national missions§!"
 gecko_menu_page_47_body_2:0 "Strategic religious provinces and national missions can add missionaries, religious modifiers or special"
 gecko_menu_page_47_body_2_line_1:0 "government access. Their activation conditions may require a particular religion, ownership or control. Use"
 gecko_menu_page_51_heading_3:0 "§YVII - Ewiger Landfriede§!"
 gecko_menu_page_51_body_3:0 "Emperor: §G+5% army morale and +0.5 yearly prestige§!. All imperial countries: §G-5% technology cost§!. Imperial"
 gecko_menu_page_51_body_3_line_1:0 "provinces: §G+10% institution spread§!."
 gecko_menu_page_53_body_0_line_1:0 "§Gdevelopment cost§!."
 gecko_menu_page_53_body_1_line_1:0 "§Garmy morale§!. Imperial provinces: §G+25% manpower§!."
 gecko_menu_page_53_body_2_line_1:0 "Empire."
 gecko_menu_page_10_body_1_line_2:0 "§Gmanpower§!."
 gecko_menu_page_11_body_0_line_2:0 "develop."
 gecko_menu_page_11_body_1_line_2:0 "§Y10-year country cooldown§!."
 gecko_menu_page_11_heading_2:0 "§YWhat changes§!"
 gecko_menu_page_11_body_2:0 "Wool changes to cloth; the other eligible goods receive their corresponding permanent production-hub"
 gecko_menu_page_11_body_2_line_1:0 "modifiers. Regulation Bureau adds a further hub bonus when its Infrastructure Ideas requirement is satisfied."
 gecko_menu_page_12_heading_3:0 "§YEdict timing§!"
 gecko_menu_page_12_body_3:0 "The ordinary edict lock is §Y1 month§!. Bulk removal blocks new edicts for §Y33 days§!. Advancement Effort adds"
 gecko_menu_page_12_body_3_line_1:0 "§G+0.5 flat monthly institution growth§!. The former age-specific government edicts have no active unlock in"
 gecko_menu_page_12_body_3_line_2:0 "Gecko."
 gecko_menu_page_13_heading_1:0 "§YGoverning-cost trade-off§!"
 gecko_menu_page_13_body_1:0 "The same expansion adds §R+10 flat local governing cost and +10% local governing cost§!. Compare the economic"
 gecko_menu_page_13_body_1_line_1:0 "gain with your remaining national capacity: exceeding the cap can outweigh the local development discount."
 gecko_menu_page_14_body_0_line_2:0 "§YDIP§!."
 gecko_menu_page_14_body_2_line_2:0 "province, state or country."
 gecko_menu_page_15_body_1_line_2:0 "ownership conditions, not ordinary trading-in bonuses."
 gecko_menu_page_15_heading_2:0 "§YRegional conditions§!"
 gecko_menu_page_15_body_2:0 "Italian Riches, Berber Raids and Stop the Raids use specific country, institution and regional-ownership"
 gecko_menu_page_15_body_2_line_1:0 "requirements. Their tooltips are the reference for whether your campaign qualifies; simply being located in the"
 gecko_menu_page_15_body_2_line_2:0 "region is insufficient."
 gecko_menu_page_16_body_0_line_2:0 "professionalism."
 gecko_menu_page_16_heading_2:0 "§YRead current technology§!"
 gecko_menu_page_16_body_2:0 "Military technology and unit pips differ from vanilla. Tactics and combat improvements are distributed"
 gecko_menu_page_16_body_2_line_1:0 "through the technology tree; idea groups and some policies can also grant tactics. Compare the current"
 gecko_menu_page_16_body_2_line_2:0 "technology and unit tooltips before timing a war."
 gecko_menu_page_18_body_1_line_2:0 "discipline and lower manpower and maintenance use."
 gecko_menu_page_21_body_0_line_2:0 "your mercenary limit, capped by available capacity."
 gecko_menu_page_21_body_1_line_2:0 "land-force-limit modifiers are not the basis of this calculation."
 gecko_menu_page_21_body_2_line_2:0 "control."
 gecko_menu_page_22_body_0_line_2:0 "number of owned mercenaries."
 gecko_menu_page_22_body_1_line_1:0 "before 1520, then from 1520 / 1580 / 1630 / 1680. The half-cost branch brings the last three thresholds"
 gecko_menu_page_22_body_1_line_2:0 "forward to §Y1570 / 1620 / 1670§!."
 gecko_menu_page_22_body_2_line_2:0 "ongoing penalties."
 gecko_menu_page_26_body_0_line_2:0 "ownership."
 gecko_menu_page_27_body_2_line_2:0 "their original colours; subject relationships remain unchanged."
 gecko_menu_page_36_body_2_line_2:0 "previews help reveal alternative paths."
 gecko_menu_page_37_body_1_line_2:0 "rather than assuming the vanilla reward package."
