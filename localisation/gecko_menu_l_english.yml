 gecko_menu_index_number_3:0 "Chapters 19-19 / 19"
 gecko_menu_page_0_title:0 "§YWelcome to Gecko§!"
 gecko_menu_page_0_lead:0 "A practical guide to the rules that change campaign planning."
 gecko_menu_page_0_heading_0:0 "§YYour first checks§!"
 gecko_menu_page_0_body_0:0 "Review government reforms, estates and your mission tree before spending power. Many national systems"
 gecko_menu_page_0_body_0_line_1:0 "depend on a mission, reform, culture or DLC; a bonus described for one country is not a universal unlock."
 gecko_menu_page_0_heading_1:0 "§YUseful interfaces§!"
 gecko_menu_page_0_body_1:0 "Court Recruitment selects advisors and exploration leaders. Province buttons create trade centres and"
 gecko_menu_page_0_body_1_line_1:0 "production hubs. Hover mission-preview controls to inspect alternative mission paths before choosing them."
 gecko_menu_page_0_heading_2:0 "§YDecision helpers§!"
 gecko_menu_page_0_body_2:0 "Building helpers locate missing production or manpower buildings, inefficient temples and provinces without"
 gecko_menu_page_0_body_2_line_1:0 "free slots. Some appear only after technology requirements are met. Hide/Show Extra Decisions controls the"
 gecko_menu_page_0_body_2_line_2:0 "extra helpers."
 gecko_menu_page_0_number:0 "Getting Started • 1 / 2"
 gecko_menu_page_1_title:0 "§YMap and strategic provinces§!"
 gecko_menu_page_1_lead:0 "Use the actual map and province tooltips when planning expansion."
 gecko_menu_page_1_heading_0:0 "§YChanged geography§!"
 gecko_menu_page_1_body_0:0 "Kent-Calais, Gibraltar-Ceuta and Tajura-Mokha are direct land links. Added straits link islands and nearby"
 gecko_menu_page_1_body_0_line_1:0 "coasts in the Mediterranean, Indian Ocean and Caribbean, including Sicily-Malta and Rhodes-Crete. Hormuz"
 gecko_menu_page_1_body_0_line_2:0 "has strait crossings to the mainland and Qawasim."
 gecko_menu_page_1_heading_1:0 "§YCritical province bonuses§!"
 gecko_menu_page_1_body_1:0 "Certain strategic provinces grant military or economic bonuses while their activation conditions hold."
 gecko_menu_page_1_body_1_line_1:0 "Occupation, country identity and control of the surrounding area may matter; owning the named city alone is"
 gecko_menu_page_1_body_1_line_2:0 "not always sufficient."
 gecko_menu_page_1_heading_2:0 "§YExamples§!"
 gecko_menu_page_1_body_2:0 "Constantinople can reward a qualifying non-Ottoman owner with combat and tax bonuses. Jerusalem grants a"
 gecko_menu_page_1_body_2_line_1:0 "missionary to specified Christian and Muslim religions. Check the province modifier tooltip for the exact"
 gecko_menu_page_1_body_2_line_2:0 "local conditions."
 gecko_menu_page_1_number:0 "Getting Started • 2 / 2"
 gecko_menu_page_2_title:0 "§YGoverning capacity§!"
 gecko_menu_page_2_lead:0 "Staying within capacity is a central economic and military constraint."
 gecko_menu_page_2_heading_0:0 "§YUnder the limit§!"
 gecko_menu_page_2_body_0:0 "Unused governing capacity gives a scaling development-cost reduction, reaching §G-10%§! at the maximum unused"
 gecko_menu_page_2_body_0_line_1:0 "share. The benefit shrinks as capacity fills."
 gecko_menu_page_2_heading_1:0 "§YOver the limit§!"
 gecko_menu_page_2_body_1:0 "Penalties scale with the excess. At §Y100% over capacity§!: manpower §R-80%§!, administrative efficiency §R-25%§!,"
 gecko_menu_page_2_body_1_line_1:0 "advisor cost §R+100%§! and state maintenance §R+150%§!, alongside other serious penalties."
 gecko_menu_page_2_heading_2:0 "§YExpand administration§!"
 gecko_menu_page_2_body_2:0 "Expand Administration grants §G150 governing capacity§! per use; its base reform-progress cost is §Y400§!."
 gecko_menu_page_2_body_2_line_1:0 "Centralizing a state costs §Y200 ADM§! and takes §Y5 years§!. Buildings, reforms and subject management offer other"
 gecko_menu_page_2_body_2_line_2:0 "ways to manage capacity."
 gecko_menu_page_2_number:0 "Government • 1 / 3"
 gecko_menu_page_3_title:0 "§YEducate Ruler§!"
 gecko_menu_page_3_lead:0 "Improve low ruler skills directly from the Court interface."
 gecko_menu_page_3_heading_0:0 "§YWhere to click§!"
 gecko_menu_page_3_body_0:0 "Open the Court interface and click the ruler's ADM, DIP or MIL skill icon. The corresponding education"
 gecko_menu_page_3_body_0_line_1:0 "button is available only while that skill is below §Y3§!."
 gecko_menu_page_3_heading_1:0 "§YCost and result§!"
 gecko_menu_page_3_body_1:0 "Each click costs §Y20% of annual income§! (0.2 years) and adds §G+1§! to the selected skill. You must have enough"
 gecko_menu_page_3_body_1_line_1:0 "ducats for each purchase. Repeat separately for ADM, DIP and MIL, up to §Y3 in each skill§!."
 gecko_menu_page_3_heading_2:0 "§YRestrictions and the decision§!"
 gecko_menu_page_3_body_2:0 "Governments with term elections, election on death, lottery elections or the merchant-republic attribute"
 gecko_menu_page_3_body_2_line_1:0 "cannot use these buttons. The Educate the Ruler decision only opens an explanation; training is performed"
 gecko_menu_page_3_body_2_line_2:0 "through the skill icons."
 gecko_menu_page_3_number:0 "Government • 2 / 3"
 gecko_menu_page_4_title:0 "§YRulers and political institutions§!"
 gecko_menu_page_4_lead:0 "Government choice affects more than its listed modifiers."
 gecko_menu_page_4_heading_0:0 "§YReturn to parliament§!"
 gecko_menu_page_4_body_0:0 "Removing a parliament-granting reform starts a §Y10-year§! wait before adopting a parliament again. An existing"
 gecko_menu_page_4_body_0_line_1:0 "parliament remains usable; the restriction concerns returning after removal."
 gecko_menu_page_4_heading_1:0 "§YGovernment changes§!"
 gecko_menu_page_4_body_1:0 "Changing reforms has a base cost of §Y10 reform progress§!. National reforms can lock a government tier or"
 gecko_menu_page_4_body_1_line_1:0 "require a previously acquired reform. Inspect available reforms before assuming a vanilla conversion route is"
 gecko_menu_page_4_body_1_line_2:0 "possible."
 gecko_menu_page_4_heading_2:0 "§YMilitary reform choice§!"
 gecko_menu_page_4_body_2:0 "Noble Regiments grants §G+7.5% army morale and +1 possible policy§!. Professional Army grants §G+2.5%§!"
 gecko_menu_page_4_body_2_line_1:0 "§Gdiscipline, +0.5 yearly army tradition and +0.1 percentage points of yearly professionalism§!. The listed colonial"
 gecko_menu_page_4_body_2_line_2:0 "government forms cannot select these reforms."
 gecko_menu_page_4_number:0 "Government • 3 / 3"
 gecko_menu_page_5_title:0 "§YEstates and crownland§!"
 gecko_menu_page_5_lead:0 "Estate privileges have been extensively rewritten."
 gecko_menu_page_5_heading_0:0 "§YLoyalty and power privileges§!"
 gecko_menu_page_5_body_0:0 "Base estate loyalty equilibrium is §Y50%§!. Standard estate privileges no longer increase equilibrium. The estate"
 gecko_menu_page_5_body_0_line_1:0 "privileges granting §Y+1 ADM, +1 DIP or +1 MIL per month§! have been removed."
 gecko_menu_page_5_heading_1:0 "§YStarting crownland§!"
 gecko_menu_page_5_body_1:0 "All player-controlled countries start with §Y5% crownland§!. Plan your first privileges and land interactions"
 gecko_menu_page_5_body_1_line_1:0 "around this opening share."
 gecko_menu_page_5_heading_2:0 "§YSelling titles§!"
 gecko_menu_page_5_body_2:0 "Sale of Titles requires only §Y0.1% crownland§!. It has a §Y120-month§! cooldown and ordinarily pays §Y1.5 years§! of"
 gecko_menu_page_5_body_2_line_1:0 "estate-land income. Check the live tooltip for government or mission exceptions."
 gecko_menu_page_5_number:0 "Estates • 1 / 2"
 gecko_menu_page_6_title:0 "§YFinancial demand and conscription§!"
 gecko_menu_page_6_lead:0 "Powerful privileges come with conditions and opportunity costs."
 gecko_menu_page_6_heading_0:0 "§YMerchant Guild Financial Demand§!"
 gecko_menu_page_6_body_0:0 "With the required DLC, this privilege is selectable at peace with at least §Y10 loans§!. It grants an interest benefit"
 gecko_menu_page_6_body_0_line_1:0 "but blocks declarations of war and adds §R+5% all power costs§!. Its cooldown is §Y5 years§!."
 gecko_menu_page_6_heading_1:0 "§YRenew or revoke§!"
 gecko_menu_page_6_body_1:0 "At cooldown expiry, the event offers renewal with §G+10 Burgher loyalty§! or removal with §R-10 loyalty§!. The"
 gecko_menu_page_6_body_1_line_1:0 "privilege does not simply disappear automatically."
 gecko_menu_page_6_heading_2:0 "§YForce Conscription§!"
 gecko_menu_page_6_body_2:0 "The Nobility privilege enables its dedicated troop-demand estate action. It is incompatible with the listed"
 gecko_menu_page_6_body_2_line_1:0 "Tribal Military Service and Rajput alternatives. The action remains available while the privilege is held; check"
 gecko_menu_page_6_body_2_line_2:0 "its tooltip for the current manpower award."
 gecko_menu_page_6_number:0 "Estates • 2 / 2"
 gecko_menu_page_7_title:0 "§YCourt Recruitment§!"
 gecko_menu_page_7_lead:0 "Use the Court Recruitment button in the court interface."
 gecko_menu_page_7_heading_0:0 "§YChoose an advisor type§!"
 gecko_menu_page_7_body_0:0 "Administrative, diplomatic and military recruitment each require §Y25§! power in the corresponding category to"
 gecko_menu_page_7_body_0_line_1:0 "enter the selection. The following event lets you choose a specific advisor type rather than waiting for the"
 gecko_menu_page_7_body_0_line_2:0 "random pool."
 gecko_menu_page_7_heading_1:0 "§YExploration leaders§!"
 gecko_menu_page_7_body_1:0 "A foreign conquistador costs §Y0.2 years of income§!; a foreign explorer costs §Y0.1 years§!. Each is created with §Y10§!"
 gecko_menu_page_7_body_1_line_1:0 "§Ytradition§! and has its own §Y5-year§! hiring cooldown. Colonial bonuses are granted automatically at §YDIP Tech 6§!"
 gecko_menu_page_7_body_1_line_2:0 "for non-colonial countries and §Y10§! for colonial nations."
 gecko_menu_page_7_heading_2:0 "§YSplendid Court§!"
 gecko_menu_page_7_body_2:0 "During the Age of Discovery, a human non-colonial country at peace with at least one level-3 advisor receives"
 gecko_menu_page_7_body_2_line_1:0 "§G-10% advisor cost§! and §G-5% development cost§!. Losing the conditions removes the triggered benefit."
 gecko_menu_page_7_number:0 "Court & Advisors • 1 / 2"
 gecko_menu_page_8_title:0 "§YGreat advisor events§!"
 gecko_menu_page_8_lead:0 "Advisor events have their own requirements and cooldowns."
 gecko_menu_page_8_heading_0:0 "§YMilitary events§!"
 gecko_menu_page_8_body_0:0 "Army Reformer and Grand Captain events require a level-3 advisor and §YMilitary Technology 9§!. The Grand"
 gecko_menu_page_8_body_0_line_1:0 "Captain's award options apply a §Y100-year§! cooldown; postponing instead applies a §Y10-year§! cooldown."
 gecko_menu_page_8_heading_1:0 "§YDo not assume repeatability§!"
 gecko_menu_page_8_body_1:0 "The Army Reformer does not share the Grand Captain's repeating cooldown. Gecko Menu > Country"
 gecko_menu_page_8_body_1_line_1:0 "Information > Critical Events shows the original usage and cooldown checks for these events; other event"
 gecko_menu_page_8_body_1_line_2:0 "prerequisites still apply."
 gecko_menu_page_8_number:0 "Court & Advisors • 2 / 2"
 gecko_menu_page_9_title:0 "§YTwo kinds of golden age§!"
 gecko_menu_page_9_lead:0 "Military and economic golden-age benefits are separate."
 gecko_menu_page_9_heading_0:0 "§YMilitary golden era§!"
 gecko_menu_page_9_body_0:0 "The ordinary golden-era modifier gives §G+10% army and navy morale§!, §G+1 maximum general fire and shock§!,"
 gecko_menu_page_9_body_0_line_1:0 "and §G+25 maximum absolutism and revolutionary zeal§!. Its listed bonuses do not include the vanilla"
 gecko_menu_page_9_body_0_line_2:0 "all-power-cost reduction."
 gecko_menu_page_9_heading_1:0 "§YEconomic golden age§!"
 gecko_menu_page_9_body_1:0 "The economic button requires §Y100 ADM, 100 DIP, 100 MIL and 200 splendor§!. It applies Urbanisation for"
 gecko_menu_page_9_body_1_line_1:0 "§Y50 years§!: §G-10% all power costs§! and §G+10% goods produced§!. It is available separately from the military golden"
 gecko_menu_page_9_body_1_line_2:0 "era, with a country-specific eligibility check for Portugal."
 gecko_menu_page_9_heading_2:0 "§YInvest splendor§!"
 gecko_menu_page_9_body_2:0 "The extra age-interface button converts §Y800 splendor§! into §G50 government reform progress§!. Age abilities and"
 gecko_menu_page_9_body_2_line_1:0 "national age bonuses also differ from vanilla; inspect their current tooltips before committing splendor."
 gecko_menu_page_9_number:0 "Ages & Splendor • 1 / 1"
 gecko_menu_page_10_title:0 "§YProvincial Investment§!"
 gecko_menu_page_10_lead:0 "Specialize suitable provinces through the province interface."
 gecko_menu_page_10_heading_0:0 "§YWhere and what it costs§!"
 gecko_menu_page_10_body_0:0 "Use Provincial Investment on an owned, fully cored province with at least §Y10 base production§! and a"
 gecko_menu_page_10_body_0_line_1:0 "production building. It costs §Y200 ducats + 50 DIP§!. Eligible goods are §Ygrain, livestock, naval supplies and§!"
 gecko_menu_page_10_body_0_line_2:0 "§Ywool§!."
 gecko_menu_page_10_heading_1:0 "§YPermanent provincial specialization§!"
 gecko_menu_page_10_body_1:0 "Each province can be invested in once, with a §Y10-year country cooldown§! between investments. Wool becomes"
 gecko_menu_page_10_body_1_line_1:0 "§Ycloth§!; the other goods retain their type and gain their permanent production-hub modifier."
 gecko_menu_page_10_heading_2:0 "§YProduction-hub rewards§!"
 gecko_menu_page_10_body_2:0 "Grain and naval supplies gain §G+50% local trade value and -15% development cost§!; livestock gains §G+37.5% and§!"
 gecko_menu_page_10_body_2_line_1:0 "§G-15%§!. The new cloth hub gains §G-5% development cost§!. Infrastructure Ideas can add §G+1 flat goods produced§! to"
 gecko_menu_page_10_body_2_line_2:0 "any of these hubs."
 gecko_menu_page_10_number:0 "Province Buttons • 1 / 2"
 gecko_menu_page_11_title:0 "§YCreate a Trade Centre§!"
 gecko_menu_page_11_lead:0 "Create a new local trade anchor with the province button."
 gecko_menu_page_11_heading_0:0 "§YRequirements§!"
 gecko_menu_page_11_body_0:0 "At peace, choose an owned §Y30-development full state core§! with a marketplace, trade depot or stock exchange."
 gecko_menu_page_11_body_0_line_1:0 "Its area must have no existing centre. The button also checks the country trade-hub restriction."
 gecko_menu_page_11_heading_1:0 "§YCost and result§!"
 gecko_menu_page_11_body_1:0 "Normally costs §Y200 ducats + 50 DIP§!; in North or South America, §Y500 ducats + 100 DIP§!. Creates a §Ylevel-1§!"
 gecko_menu_page_11_body_1_line_1:0 "§Ycentre§! and adds §G+2 base production§!. Upgrade the centre afterwards through the usual province controls."
 gecko_menu_page_11_number:0 "Province Buttons • 2 / 2"
 gecko_menu_page_12_title:0 "§YBuildings support development§!"
 gecko_menu_page_12_lead:0 "Infrastructure decisions affect both output and future investment."
 gecko_menu_page_12_heading_0:0 "§YBuilding investment discount§!"
 gecko_menu_page_12_body_0:0 "For §Y1 / 2 / 3 / 4 / 5 / 6 buildings§!, the base development-cost-modifier discounts are §G1.5 / 2.5 / 3.5 / 4.5 / 5.5§!"
 gecko_menu_page_12_body_0_line_1:0 "§G/ 7.5%§!. This is a tiered schedule, not a flat 1.25% per building. Infrastructure Ideas can add a separate"
 gecko_menu_page_12_body_0_line_2:0 "matching investment bonus."
 gecko_menu_page_12_heading_1:0 "§YMilitary buildings§!"
 gecko_menu_page_12_body_1:0 "Barracks grant §G+250 flat manpower§! on livestock, in addition to their normal modifier. Regimental Camps give"
 gecko_menu_page_12_body_1_line_1:0 "§G+0.75 force limit§! plus §G+0.25§! on grain. The Armoury costs §Y250 ducats§! and grants §G+2 force limit and +500§!"
 gecko_menu_page_12_body_1_line_2:0 "§Gmanpower§!."
 gecko_menu_page_12_heading_2:0 "§YArmoury requirement§!"
 gecko_menu_page_12_body_2:0 "The Armoury's build trigger checks §Y30 development across the area§!, rather than requiring a single"
 gecko_menu_page_12_body_2_line_1:0 "30-development province. Its construction takes §Y60 months§!. Building-generated development is conditional on"
 gecko_menu_page_12_body_2_line_2:0 "a country unlock, not universal."
 gecko_menu_page_12_number:0 "Economy & Buildings • 1 / 4"
 gecko_menu_page_13_title:0 "§YCourthouses§!"
 gecko_menu_page_13_lead:0 "Terrain-specific investment discounts reward careful province selection."
 gecko_menu_page_13_heading_0:0 "§YCourthouses§!"
 gecko_menu_page_13_body_0:0 "Besides reducing governing costs and autonomy, courthouses activate terrain-specific development investment"
 gecko_menu_page_13_body_0_line_1:0 "bonuses. The discount depends on your province's terrain; inspect its modifier tooltip when choosing where to"
 gecko_menu_page_13_body_0_line_2:0 "develop."
 gecko_menu_page_13_number:0 "Economy & Buildings • 2 / 4"
 gecko_menu_page_14_title:0 "§YDebt, bankruptcy and state edicts§!"
 gecko_menu_page_14_lead:0 "Financing and administration directly affect wartime strength."
 gecko_menu_page_14_heading_0:0 "§YLoans and inflation§!"
 gecko_menu_page_14_body_0:0 "Each bank loan adds §R+0.5% building cost§! and §R-0.6% mercenary force-limit modifier§!. Each point of inflation"
 gecko_menu_page_14_body_0_line_1:0 "adds §R-2% mercenary force-limit modifier§! and §R-1% mercenary discipline§!, alongside its other cost increases."
 gecko_menu_page_14_heading_1:0 "§YBankruptcy§!"
 gecko_menu_page_14_body_1:0 "Human players must have §Y+3 stability§! to declare bankruptcy. Its penalties include §R-50% army and navy morale§!"
 gecko_menu_page_14_body_1_line_1:0 "and §R-100% manpower and sailor recovery§!. Treat debt control as part of military preparation."
 gecko_menu_page_14_heading_2:0 "§YState edicts§!"
 gecko_menu_page_14_body_2:0 "Open Gecko Menu > Actions > State Edicts. Apply an edict everywhere, or only in states without an edict."
 gecko_menu_page_14_body_2_line_1:0 "Existing edicts are preserved in the second mode. Only edicts unlocked for your country are shown."
 gecko_menu_page_14_heading_3:0 "§YEdict timing§!"
 gecko_menu_page_14_body_3:0 "The ordinary edict lock is §Y1 month§!. Bulk removal blocks new edicts for §Y33 days§!. Advancement Effort adds"
 gecko_menu_page_14_body_3_line_1:0 "§G+0.5 flat monthly institution growth§!. The former age-specific government edicts have no active unlock in"
 gecko_menu_page_14_body_3_line_2:0 "Gecko."
 gecko_menu_page_14_number:0 "Economy & Buildings • 3 / 4"
 gecko_menu_page_15_title:0 "§YExpand Infrastructure§!"
 gecko_menu_page_15_lead:0 "Concentrating investment improves a province but consumes governing capacity."
 gecko_menu_page_15_heading_0:0 "§YLocal benefits§!"
 gecko_menu_page_15_body_0:0 "Each expansion grants §G+1 building slot and +1 manufactory slot§!, §G-10% development cost§!, §G+5% goods§!"
 gecko_menu_page_15_body_0_line_1:0 "§Gproduced§!, and several tax, production, manpower and recruitment benefits. It also adds §G+0.75 land and +1§!"
 gecko_menu_page_15_body_0_line_2:0 "§Gnaval force limit§!."
 gecko_menu_page_15_heading_1:0 "§YGoverning-cost trade-off§!"
 gecko_menu_page_15_body_1:0 "The same expansion adds §R+10 flat local governing cost and +10% local governing cost§!. Compare the economic"
 gecko_menu_page_15_body_1_line_1:0 "gain with your remaining national capacity: exceeding the cap can outweigh the local development discount."
 gecko_menu_page_15_number:0 "Economy & Buildings • 4 / 4"
 gecko_menu_page_16_title:0 "§YTrade-centre upgrades§!"
 gecko_menu_page_16_lead:0 "Trade centres now have five levels."
 gecko_menu_page_16_heading_0:0 "§YNew centre and upgrades§!"
 gecko_menu_page_16_body_0:0 "Base upgrade costs for levels §Y2 / 3 / 4 / 5§! are §Y200 / 500 / 1,000 / 1,500 ducats§!. Both inland and coastal"
 gecko_menu_page_16_body_0_line_1:0 "centres use this five-level progression."
 gecko_menu_page_16_heading_1:0 "§YBeyond local trade power§!"
 gecko_menu_page_16_body_1:0 "Higher levels also improve their state: development cost, manpower, sailors, trade value and building slots"
 gecko_menu_page_16_body_1_line_1:0 "vary by tier. Level 5 grants a national naval-tradition-decay benefit. Read whether a bonus applies to the"
 gecko_menu_page_16_body_1_line_2:0 "province, state or country."
 gecko_menu_page_16_number:0 "Trade • 1 / 2"
 gecko_menu_page_17_title:0 "§YTrade networks and monopolies§!"
 gecko_menu_page_17_lead:0 "The trade map and regional resources deserve a fresh assessment."
 gecko_menu_page_17_heading_0:0 "§YRoutes and investments§!"
 gecko_menu_page_17_body_0:0 "Trade nodes and connections have been reworked. Plan merchants from the mod's trade map rather than a"
 gecko_menu_page_17_body_0_line_1:0 "vanilla route diagram. Trade-company investments distinguish company-province bonuses from benefits"
 gecko_menu_page_17_body_0_line_2:0 "applying to the whole area."
 gecko_menu_page_17_heading_1:0 "§YAfrican resources§!"
 gecko_menu_page_17_body_1:0 "Owning African slave or gold provinces can unlock additional triggered benefits. Stronger monopoly variants"
 gecko_menu_page_17_body_1_line_1:0 "require all African provinces of that trade good; smaller variants use ownership thresholds. These are"
 gecko_menu_page_17_body_1_line_2:0 "ownership conditions, not ordinary trading-in bonuses."
 gecko_menu_page_17_heading_2:0 "§YRegional conditions§!"
 gecko_menu_page_17_body_2:0 "Italian Riches, Berber Raids and Stop the Raids use specific country, institution and regional-ownership"
 gecko_menu_page_17_body_2_line_1:0 "requirements. Their tooltips are the reference for whether your campaign qualifies; simply being located in the"
 gecko_menu_page_17_body_2_line_2:0 "region is insufficient."
 gecko_menu_page_17_number:0 "Trade • 2 / 2"
 gecko_menu_page_18_title:0 "§YMilitary planning§!"
 gecko_menu_page_18_lead:0 "Technology, tradition and professionalism have been rebalanced."
 gecko_menu_page_18_heading_0:0 "§YArmy tradition§!"
 gecko_menu_page_18_body_0:0 "At §Y100 Army Tradition§!, its scaled modifier includes §G+15% land force limit§! and §G+15% mercenary force-limit§!"
 gecko_menu_page_18_body_0_line_1:0 "§Gmodifier§!, alongside morale, recovery, siege and other bonuses. Tradition also contributes yearly"
 gecko_menu_page_18_body_0_line_2:0 "professionalism."
 gecko_menu_page_18_heading_1:0 "§YProfessionalism§!"
 gecko_menu_page_18_body_1:0 "The thresholds remain §Y20 / 40 / 60 / 80 / 100%§!. Supply depots unlock at 20%, garrison refill at 40% and"
 gecko_menu_page_18_body_1_line_1:0 "manpower return on disband at 60%. Later tiers add cumulative general-cost and drill-gain benefits."
 gecko_menu_page_18_heading_2:0 "§YRead current technology§!"
 gecko_menu_page_18_body_2:0 "Military technology and unit pips differ from vanilla. Tactics and combat improvements are distributed"
 gecko_menu_page_18_body_2_line_1:0 "through the technology tree; idea groups and some policies can also grant tactics. Compare the current"
 gecko_menu_page_18_body_2_line_2:0 "technology and unit tooltips before timing a war."
 gecko_menu_page_18_number:0 "Army & Technology • 1 / 5"
 gecko_menu_page_19_title:0 "§YCombat and siege rules§!"
 gecko_menu_page_19_lead:0 "Several global values change the pace of warfare."
 gecko_menu_page_19_heading_0:0 "§YSieges and barrages§!"
 gecko_menu_page_19_body_0:0 "Base garrisons contain §Y3,000 men per fort level§!. The siege-force requirement uses a §Y0.334§! multiplier. Artillery"
 gecko_menu_page_19_body_0_line_1:0 "barrages cost §Y25 MIL§! and naval barrages §Y15 MIL§! before modifiers; assault power cost is §Y0§!."
 gecko_menu_page_19_heading_1:0 "§YWar score§!"
 gecko_menu_page_19_body_1:0 "The default ticking-war-score rate is §Y0.7§!, capped at §Y40§!. Battles can contribute up to §Y50 war score§!. Individual"
 gecko_menu_page_19_body_1_line_1:0 "Casus Belli and war goals can override their relevant rules."
 gecko_menu_page_19_heading_2:0 "§YDrill and the back row§!"
 gecko_menu_page_19_body_2:0 "Yearly drill gain is §Y30§!. Back-row artillery takes §Y0§! strength and morale damage through the back-row damage"
 gecko_menu_page_19_body_2_line_1:0 "multipliers. These rules do not protect artillery once it is forced into the front row."
 gecko_menu_page_19_number:0 "Army & Technology • 2 / 5"
 gecko_menu_page_20_title:0 "§YHeavy units and policy builds§!"
 gecko_menu_page_20_lead:0 "Use estate privileges and dedicated policies to build a stronger army."
 gecko_menu_page_20_heading_0:0 "§YAvailable through the Nobility§!"
 gecko_menu_page_20_body_0:0 "The Nobility privilege §YInvest in Heavy Cavalry§! unlocks both §YHeavy Infantry§! and §YHeavy Cavalry§!, using the"
 gecko_menu_page_20_body_0_line_1:0 "former Cossack regiment system. Access is not restricted by country or culture. The privilege requires the"
 gecko_menu_page_20_body_0_line_2:0 "§YDomination§! DLC and at least §Y1% cavalry§! in your army."
 gecko_menu_page_20_heading_1:0 "§YShared heavy-regiment bonuses§!"
 gecko_menu_page_20_body_1:0 "Both heavy unit types gain §G+15% shock damage§! and §G-10% fire damage received§!. The privilege adds a §G15%§!"
 gecko_menu_page_20_body_1_line_1:0 "§Gspecial-regiment allowance§! and §G+15% cavalry-to-infantry ratio§!, at §R+10% cavalry cost§!."
 gecko_menu_page_20_heading_2:0 "§YStrong supporting policies§!"
 gecko_menu_page_20_body_2:0 "Plan your idea groups around heavy-unit policies. §YDiplomatic + Offensive§! supports heavy infantry with"
 gecko_menu_page_20_body_2_line_1:0 "combat ability and discipline; §YCourt + Quality§! adds flat infantry fire and shock, with stronger tiers at MIL §Y15§!"
 gecko_menu_page_20_body_2_line_2:0 "§Y/ 22§!. §YEconomic + Theocratic§! strengthens heavy cavalry combat and shock damage. Replace old policy tiers"
 gecko_menu_page_20_body_2_line_3:0 "manually as technology advances."
 gecko_menu_page_20_number:0 "Army & Technology • 3 / 5"
 gecko_menu_page_21_title:0 "§YMilitary Reform: timing§!"
 gecko_menu_page_21_lead:0 "Plan a one-time choice between military strength and a development window."
 gecko_menu_page_21_heading_0:0 "§YWhen it can appear§!"
 gecko_menu_page_21_body_0:0 "Available only from §Y1500§! onwards. A non-colonial country needs a ruler with §Yat least 5 MIL§!, an unused"
 gecko_menu_page_21_body_0_line_1:0 "reform choice, and no active reform or postponement modifier."
 gecko_menu_page_21_heading_1:0 "§YPlan your development§!"
 gecko_menu_page_21_body_1:0 "Focus on internal development creates a §Y10-year§! window with §G-10% development cost§!. Save monarch power"
 gecko_menu_page_21_body_1_line_1:0 "and prepare local development discounts before choosing it."
 gecko_menu_page_21_heading_2:0 "§YPostpone or commit§!"
 gecko_menu_page_21_body_2:0 "Postponing blocks the event for §Y20 years§! without consuming the choice. Accepting any reward §Yuses up the§!"
 gecko_menu_page_21_body_2_line_1:0 "§Yreform choice permanently§!, even after its 10-year bonus expires."
 gecko_menu_page_21_number:0 "Army & Technology • 4 / 5"
 gecko_menu_page_22_title:0 "§YMilitary Reform: rewards§!"
 gecko_menu_page_22_lead:0 "Choose one package. Each reform modifier lasts §Y10 years§!."
 gecko_menu_page_22_heading_0:0 "§YReform the army§!"
 gecko_menu_page_22_body_0:0 "§G+20% army morale§!, §G-10% military technology cost§!, §G200 MIL§! and §G+2 percentage points of army§!"
 gecko_menu_page_22_body_0_line_1:0 "§Gprofessionalism§!."
 gecko_menu_page_22_heading_1:0 "§YFocus on internal development§!"
 gecko_menu_page_22_body_1:0 "§G-10% development cost§!, §G-10% administrative and diplomatic technology costs§!, and §G200 DIP§!."
 gecko_menu_page_22_heading_2:0 "§YSplit our funds§!"
 gecko_menu_page_22_body_2:0 "§G+10% army morale§!, §G-5% development cost§! and §G-5% ADM, DIP and MIL technology costs§!; also §G100 DIP,§!"
 gecko_menu_page_22_body_2_line_1:0 "§G100 MIL§! and §G+2 percentage points of army professionalism§!."
 gecko_menu_page_22_number:0 "Army & Technology • 5 / 5"
 gecko_menu_page_23_title:0 "§YA separate recruitment system§!"
 gecko_menu_page_23_lead:0 "Gecko mercenary decisions recruit individual regiments and bulk batches."
 gecko_menu_page_23_heading_0:0 "§YWho can recruit?§!"
 gecko_menu_page_23_body_0:0 "Recruit individual mercenary regiments or batches, much like the old pre-company mercenary system. They"
 gecko_menu_page_23_body_0_line_1:0 "can join your normal army stacks instead of arriving as a fixed company. Recruitment decisions require a"
 gecko_menu_page_23_body_0_line_2:0 "§Yhuman, independent, non-bankrupt§! country; choose infantry or cavalry."
 gecko_menu_page_23_heading_1:0 "§YMercenary force limit§!"
 gecko_menu_page_23_body_1:0 "The development-based system starts from §Y6 + 0.075 × total development × (1 - average autonomy / 100)§!. A"
 gecko_menu_page_23_body_1_line_1:0 "country with Rising Power adds §Y4§! before the mercenary-manpower modifier is applied. Ordinary"
 gecko_menu_page_23_body_1_line_2:0 "land-force-limit modifiers are not the basis of this calculation."
 gecko_menu_page_23_heading_2:0 "§YWhere troops appear§!"
 gecko_menu_page_23_body_2:0 "The preferred spawn is your controlled capital, with no siege or battle. Otherwise the system looks for a"
 gecko_menu_page_23_body_2_line_1:0 "controlled owned province without siege/battle and without a neighbouring owned province outside your"
 gecko_menu_page_23_body_2_line_2:0 "control."
 gecko_menu_page_23_number:0 "Mercenaries • 1 / 3"
 gecko_menu_page_24_title:0 "§YMercenary recruitment costs§!"
 gecko_menu_page_24_lead:0 "Plan treasury, professionalism and debt before recruiting."
 gecko_menu_page_24_heading_0:0 "§YDucat cost§!"
 gecko_menu_page_24_body_0:0 "Base recruitment is §Y30 ducats§! per infantry regiment. Cavalry uses a §Y2.5×§! multiplier. Mercenary-cost"
 gecko_menu_page_24_body_0_line_1:0 "reductions apply, with a reduction floor of §Y-90%§!. Existing mercenary companies also count when checking the"
 gecko_menu_page_24_body_0_line_2:0 "number of owned mercenaries."
 gecko_menu_page_24_heading_1:0 "§YProfessionalism cost§!"
 gecko_menu_page_24_body_1:0 "Without a waiver, each regiment costs §Y0.20 / 0.16 / 0.12 / 0.08 / 0.04 percentage points§! of professionalism:"
 gecko_menu_page_24_body_1_line_1:0 "before 1520, then from 1520 / 1580 / 1630 / 1680. The half-cost branch brings the last three thresholds"
 gecko_menu_page_24_body_1_line_2:0 "forward to §Y1570 / 1620 / 1670§!."
 gecko_menu_page_24_number:0 "Mercenaries • 2 / 3"
 gecko_menu_page_25_title:0 "§YMercenary reserves and inflation§!"
 gecko_menu_page_25_lead:0 "A treasury alone does not keep mercenaries effective."
 gecko_menu_page_25_heading_0:0 "§YInflation and debt§!"
 gecko_menu_page_25_body_0:0 "Each point of inflation gives §R-1% mercenary discipline and -2% mercenary force-limit modifier§!. Loans also"
 gecko_menu_page_25_body_0_line_1:0 "reduce mercenary capacity. These ongoing penalties remain after a recruitment batch."
 gecko_menu_page_25_heading_1:0 "§YLow reserves during war§!"
 gecko_menu_page_25_body_1:0 "Below §Y10% manpower§! while at war, Mercenary Unrest gives §R-5% mercenary discipline§!. The linked hidden"
 gecko_menu_page_25_body_1_line_1:0 "payment event then applies §R-75% mercenary reinforcement speed§!. Reinforcement is heavily slowed, not"
 gecko_menu_page_25_body_1_line_2:0 "completely stopped."
 gecko_menu_page_25_heading_2:0 "§YRecovery is event-driven§!"
 gecko_menu_page_25_body_2:0 "Once Mercenary Unrest is no longer active, a follow-up hidden event removes the reinforcement penalty."
 gecko_menu_page_25_body_2_line_1:0 "Both events have a §Y1-month mean time§!, so application and recovery need not happen immediately when"
 gecko_menu_page_25_body_2_line_2:0 "reserves cross the threshold or the war ends."
 gecko_menu_page_25_number:0 "Mercenaries • 3 / 3"
 gecko_menu_page_26_title:0 "§YNaval planning§!"
 gecko_menu_page_26_lead:0 "Ships, sailors and doctrines have their own balance changes."
 gecko_menu_page_26_heading_0:0 "§YCosts and transport§!"
 gecko_menu_page_26_body_0:0 "Base heavy-ship cost is §Y35 ducats§!; base transport cost is §Y1 ducat§! and §Y1 sailor§!. Naval force-limit overage uses a"
 gecko_menu_page_26_body_0_line_1:0 "§Y4×§! extra-cost factor, making an oversized fleet expensive."
 gecko_menu_page_26_heading_1:0 "§YNaval doctrines§!"
 gecko_menu_page_26_body_1:0 "The minimum naval force limit for doctrines is §Y15§!. Switching uses §Y5% of sailors§! through the doctrine-switch"
 gecko_menu_page_26_body_1_line_1:0 "cost define. Generic and national doctrines have been rewritten; for example Free Oarsmen grants marine"
 gecko_menu_page_26_body_1_line_2:0 "capacity, while Merchant Navy improves ship-power propagation."
 gecko_menu_page_26_heading_2:0 "§YMarines§!"
 gecko_menu_page_26_body_2:0 "Marines are enabled in the base country values. Their regiment modifier improves disembarkation and"
 gecko_menu_page_26_body_2_line_1:0 "reduces shock damage received. Your allowed fraction and recruitment access still depend on modifiers, ideas,"
 gecko_menu_page_26_body_2_line_2:0 "doctrines and national systems."
 gecko_menu_page_26_number:0 "Navy • 1 / 2"
 gecko_menu_page_27_title:0 "§YSpecial ships§!"
 gecko_menu_page_27_lead:0 "A special ship is not interchangeable with an ordinary hull."
 gecko_menu_page_27_heading_0:0 "§YBattle ships§!"
 gecko_menu_page_27_body_0:0 "Men of War gain §G+50% cannons§!. Galleons gain §G+10% hull size§!; Galleasses gain §G+10% galley combat ability§!."
 gecko_menu_page_27_body_0_line_1:0 "Maritime Ideas can unlock a small Men-of-War fraction."
 gecko_menu_page_27_heading_1:0 "§YTrade and transport ships§!"
 gecko_menu_page_27_body_1:0 "Special Caravels improve fleet speed and trade power while reducing attrition. VOC Indiamen combine extra"
 gecko_menu_page_27_body_1_line_1:0 "cannons and trade power with transport capability. Geobukseon also have transport and movement properties;"
 gecko_menu_page_27_body_1_line_2:0 "inspect their unusual combat modifiers before deploying them."
 gecko_menu_page_27_number:0 "Navy • 2 / 2"
 gecko_menu_page_28_title:0 "§YAlliance and peace rules§!"
 gecko_menu_page_28_lead:0 "Diplomacy has restrictions that do not appear in vanilla planning guides."
 gecko_menu_page_28_heading_0:0 "§YRe-forming a broken alliance§!"
 gecko_menu_page_28_body_0:0 "For human participants, alliance formation is blocked while either relevant Broke Alliance or wartime-break"
 gecko_menu_page_28_body_0_line_1:0 "opinion modifier remains. Wait for the modifier itself to disappear; this is not a fixed truce timer."
 gecko_menu_page_28_heading_1:0 "§YBreaking an alliance in war§!"
 gecko_menu_page_28_body_1:0 "The stability hit is §R5§!. Annul Treaties lasts §Y20 years§!. Standard peace costs include §Y5 war score§! for war"
 gecko_menu_page_28_body_1_line_1:0 "reparations, §Y25§! for annulment, and §Y30§! for humiliating a rival."
 gecko_menu_page_28_heading_2:0 "§YClaims and diplomats§!"
 gecko_menu_page_28_body_2:0 "Fabricating a claim starts at §Y10 spy-network points§!, with a §Y0.25 per-claim cost modifier§!. Rival changes use a"
 gecko_menu_page_28_body_2_line_1:0 "§Y5-year§! interval. These are base rules; national and idea modifiers may alter the final action."
 gecko_menu_page_28_number:0 "Diplomacy & War • 1 / 2"
 gecko_menu_page_29_title:0 "§YOccupation and war preparation§!"
 gecko_menu_page_29_lead:0 "Custom diplomatic actions can reduce repetitive wartime management."
 gecko_menu_page_29_heading_0:0 "§YTransfer occupations in bulk§!"
 gecko_menu_page_29_body_0:0 "The bulk-transfer actions pass eligible occupied enemy provinces between countries fighting on the same side."
 gecko_menu_page_29_body_0_line_1:0 "A separate subject action requests their occupations for the overlord. They change §Ycontrol§!, not province"
 gecko_menu_page_29_body_0_line_2:0 "ownership."
 gecko_menu_page_29_heading_1:0 "§YWar Chest§!"
 gecko_menu_page_29_body_1:0 "During Discovery or Reformation, qualifying human non-colonial countries at war can gain §G+5% mercenary§!"
 gecko_menu_page_29_body_1_line_1:0 "§Gdiscipline§!. Important requirements include §Y1.25 years of income§! in treasury, no loans, corruption below 1,"
 gecko_menu_page_29_body_1_line_2:0 "full maintenance and at least 30% army force-limit usage."
 gecko_menu_page_29_heading_2:0 "§YAdditional eligibility matters§!"
 gecko_menu_page_29_body_2:0 "War Chest also excludes hegemons, tributaries and the top three Great Powers, and applies"
 gecko_menu_page_29_body_2_line_1:0 "alliance/relative-development conditions. Rising Power bypasses its usual alliance restriction. Saving the"
 gecko_menu_page_29_body_2_line_2:0 "treasury amount alone does not guarantee activation."
 gecko_menu_page_29_number:0 "Diplomacy & War • 2 / 2"
 gecko_menu_page_30_title:0 "§YManaging an empire of subjects§!"
 gecko_menu_page_30_lead:0 "Integration timing and overlord ideas have been changed."
 gecko_menu_page_30_heading_0:0 "§YEarlier integration§!"
 gecko_menu_page_30_body_0:0 "The minimum elapsed time for vassal annexation is §Y5 years§!; personal-union integration starts after §Y10 years§!."
 gecko_menu_page_30_body_0_line_1:0 "These elapsed-time thresholds do not waive the other opinion, liberty-desire or diplomatic requirements."
 gecko_menu_page_30_heading_1:0 "§YInfluential overlords§!"
 gecko_menu_page_30_body_1:0 "The Additional Loyalist Recruitment idea grants subjects the Influential Overlord modifier, worth §G+7.5%§!"
 gecko_menu_page_30_body_1_line_1:0 "§Gdiscipline§!, while their current overlord has the idea. The system updates on subject/overlord changes rather"
 gecko_menu_page_30_body_1_line_2:0 "than granting a permanent one-off bonus."
 gecko_menu_page_30_heading_2:0 "§YColour management§!"
 gecko_menu_page_30_body_2:0 "Open Gecko Menu > Actions > Vassal Cosmetics to change the colours of eyalets, core eyalets, vassals,"
 gecko_menu_page_30_body_2_line_1:0 "marches, client subjects, cantons and appanages. Choose a lighter shade of your national colour or restore"
 gecko_menu_page_30_body_2_line_2:0 "their original colours; subject relationships remain unchanged."
 gecko_menu_page_30_number:0 "Subjects • 1 / 3"
 gecko_menu_page_31_title:0 "§YSpecial subject relationships§!"
 gecko_menu_page_31_lead:0 "Special subjects are governed by their own rules."
 gecko_menu_page_31_heading_0:0 "§YSoutheast Asian tributaries§!"
 gecko_menu_page_31_body_0:0 "Ava, Ayutthaya and Siam have a mission-gated action to elevate a tributary to a vassal. The target must have"
 gecko_menu_page_31_body_0_line_1:0 "§Yunder 300 development§! and §Yunder 50% liberty desire§!. Acceptance is required, and conversion costs §Y50 DIP§!."
 gecko_menu_page_31_heading_1:0 "§YBurgundian subjects and cantons§!"
 gecko_menu_page_31_body_1:0 "Burgundian and canton subject types are defined separately from ordinary vassals. Their diplomatic-slot,"
 gecko_menu_page_31_body_1_line_1:0 "integration and liberty-desire rules differ. Check the actual subject type before applying a standard-vassal"
 gecko_menu_page_31_body_1_line_2:0 "strategy."
 gecko_menu_page_31_heading_2:0 "§YNational subject mechanics§!"
 gecko_menu_page_31_body_2:0 "Eyalets, pronoias, appanages and other national subjects use their own diplomatic actions and mission"
 gecko_menu_page_31_body_2_line_1:0 "unlocks. Transfer occupations and colour management support some of these types without making their"
 gecko_menu_page_31_body_2_line_2:0 "political rules identical."
 gecko_menu_page_31_number:0 "Subjects • 2 / 3"
 gecko_menu_page_32_title:0 "§YTributary payments§!"
 gecko_menu_page_32_lead:0 "Tribute depends on the subject relationship and its global limits."
 gecko_menu_page_32_heading_0:0 "§YTributary payments§!"
 gecko_menu_page_32_body_0:0 "Annual monarch-point tribute has a global maximum of §Y4 points§!. The ordinary cash-tribute base rate is §Y0§!,"
 gecko_menu_page_32_body_0_line_1:0 "while manpower tribute uses its own rate. Check which tribute types your current subject relationship can"
 gecko_menu_page_32_body_0_line_2:0 "actually provide."
 gecko_menu_page_32_number:0 "Subjects • 3 / 3"
 gecko_menu_page_33_title:0 "§YExploration and colonial expansion§!"
 gecko_menu_page_33_lead:0 "Exploration Ideas are disabled; use the custom exploration route."
 gecko_menu_page_33_heading_0:0 "§YAutomatic colonial expansion§!"
 gecko_menu_page_33_body_0:0 "Automatically granted at §YDiplomatic Technology 6§! for non-colonial countries, or §Y10§! for colonial nations."
 gecko_menu_page_33_body_0_line_1:0 "The permanent bonus grants §G2 colonists§!, §G+35 settlers per year§!, extra range and permission to explore."
 gecko_menu_page_33_heading_1:0 "§YHire the right leader§!"
 gecko_menu_page_33_body_1:0 "Explorers and conquistadors come from the Court Recruitment menu and have separate hiring cooldowns."
 gecko_menu_page_33_body_1_line_1:0 "Their presence and the colonial-expansion modifier solve different requirements; hiring a leader alone does"
 gecko_menu_page_33_body_1_line_2:0 "not grant the two colonists."
 gecko_menu_page_33_heading_2:0 "§YExplore from the start§!"
 gecko_menu_page_33_body_2:0 "You can begin exploring in §Y1444§!. Open §YCourt Recruitment§! and choose §YHire a foreign explorer§! for sea"
 gecko_menu_page_33_body_2_line_1:0 "exploration or §YHire a foreign conquistador§! for land exploration. These hiring options are available from the"
 gecko_menu_page_33_body_2_line_2:0 "start, without waiting for the colonial-expansion technology unlock."
 gecko_menu_page_33_number:0 "Exploration & Colonies • 1 / 3"
 gecko_menu_page_34_title:0 "§YColonial governments and planning§!"
 gecko_menu_page_34_lead:0 "Base subject and government bonuses; optional upgrades are additional."
 gecko_menu_page_34_heading_0:0 "§YShared rules§!"
 gecko_menu_page_34_body_0:0 "Overlord bonuses require §Y10 cities§! in the colony; each type gives §G+1 merchant§!. All three governments give the"
 gecko_menu_page_34_body_0_line_1:0 "colony §G-10% institution embracement cost§! and §G+40 maximum absolutism§!, with §R-200% trade range§! and §Y6-year§!"
 gecko_menu_page_34_body_0_line_2:0 "§Yelection terms§!."
 gecko_menu_page_34_heading_1:0 "§YCrown Colony§!"
 gecko_menu_page_34_body_1:0 "§YColony:§! §G+10% manpower, +10% land force limit, +100 governing capacity, -0.1 monthly autonomy and +10§!"
 gecko_menu_page_34_body_1_line_1:0 "§Gyearly settlers§!. §YOverlord:§! receives §G10%§! of the colony's manpower and land force limit, plus §G1%§! of its sailors"
 gecko_menu_page_34_body_1_line_2:0 "and naval force limit."
 gecko_menu_page_34_heading_2:0 "§YPrivate Enterprise§!"
 gecko_menu_page_34_body_2:0 "§YColony:§! §G+1 merchant, +40% ship trade power, +20% goods produced, +10% production efficiency and +10%§!"
 gecko_menu_page_34_body_2_line_1:0 "§Gtrade efficiency§!; also §G+10% naval tradition from protecting trade and +10% ship trade-power propagation§!."
 gecko_menu_page_34_body_2_line_2:0 "§YOverlord:§! §R-5% global tariffs§!, alongside the shared merchant."
 gecko_menu_page_34_number:0 "Exploration & Colonies • 2 / 3"
 gecko_menu_page_35_title:0 "§YColonial governments and planning§!"
 gecko_menu_page_35_lead:0 "Base subject and government bonuses; optional upgrades are additional."
 gecko_menu_page_35_heading_0:0 "§YSelf-Governing Colony§!"
 gecko_menu_page_35_body_0:0 "§YColony:§! §G+2 colonists, +20 yearly settlers and -25% state maintenance§!, at §R+25 liberty desire§!. §YOverlord:§! §R-20%§!"
 gecko_menu_page_35_body_0_line_1:0 "§Rglobal tariffs§!, alongside the shared merchant. This is the expansion-focused choice, with a larger liberty-desire"
 gecko_menu_page_35_body_0_line_2:0 "trade-off."
 gecko_menu_page_35_heading_1:0 "§YPortugal: relocation restrictions§!"
 gecko_menu_page_35_body_1:0 "Portugal cannot move its capital to Africa or move its trade port through the custom action rules."
 gecko_menu_page_35_heading_2:0 "§YCultural integration§!"
 gecko_menu_page_35_body_2:0 "Promoting an accepted culture costs a base §Y25 DIP§! and requires §Y5 development§!. Culture conversion uses a"
 gecko_menu_page_35_body_2_line_1:0 "base §Y8 DIP per development§! and §Y5 months per development§!. Separatism starts from a §Y20-year§! base before"
 gecko_menu_page_35_body_2_line_2:0 "modifiers."
 gecko_menu_page_35_number:0 "Exploration & Colonies • 3 / 3"
 gecko_menu_page_36_title:0 "§YBuild variety§!"
 gecko_menu_page_36_lead:0 "Choose idea groups as a complete campaign build."
 gecko_menu_page_36_heading_0:0 "§YRemoved idea groups§!"
 gecko_menu_page_36_body_0:0 "§YExploration, Trade, Humanist, Naval, Mercenary, Horde and Indigenous§! are disabled. Expansion remains"
 gecko_menu_page_36_body_0_line_1:0 "available with a rewritten focus. Hire leaders at court; colonial bonuses unlock automatically with DIP technology."
 gecko_menu_page_36_heading_1:0 "§YIdea balance§!"
 gecko_menu_page_36_body_1:0 "The available groups have been rebalanced to make each a viable choice, supporting many more competitive"
 gecko_menu_page_36_body_1_line_1:0 "build combinations than the familiar vanilla openings. Choose around your campaign plan and policy"
 gecko_menu_page_36_body_1_line_2:0 "synergies."
 gecko_menu_page_36_heading_2:0 "§YGovernment and national ideas§!"
 gecko_menu_page_36_body_2:0 "Government attributes govern access to political idea groups. National and formable idea sets have also been"
 gecko_menu_page_36_body_2_line_1:0 "rewritten; inspect the full set before forming a country or replacing your ideas."
 gecko_menu_page_36_number:0 "Ideas & Policies • 1 / 5"
 gecko_menu_page_37_title:0 "§YPolicy combinations§!"
 gecko_menu_page_37_lead:0 "New and reworked policies broaden the ways your idea groups work together."
 gecko_menu_page_37_heading_0:0 "§YPlan combinations, not isolated groups§!"
 gecko_menu_page_37_body_0:0 "Many policies offer specialized military and economic synergies. Consider the policy unlocked by a pair of"
 gecko_menu_page_37_body_0_line_1:0 "groups when choosing your next idea group; the reworked choices support a wider range of viable builds."
 gecko_menu_page_37_heading_1:0 "§YPolicy and idea limits§!"
 gecko_menu_page_37_body_1:0 "At most §Y40%§! of selected idea groups may be from one category. Abandoning a group refunds a base §Y10%§! of its"
 gecko_menu_page_37_body_1_line_1:0 "invested power. Check policy upkeep when planning how many combinations to activate."
 gecko_menu_page_37_number:0 "Ideas & Policies • 2 / 5"
 gecko_menu_page_38_title:0 "§YMilitary policies: flat damage§!"
 gecko_menu_page_38_lead:0 "Flat fire and shock bonuses must grow with military technology."
 gecko_menu_page_38_heading_0:0 "§YWhy the bonus has levels§!"
 gecko_menu_page_38_body_0:0 "Several military policies add §Yflat fire or shock§!, rather than a percentage damage bonus. As technology"
 gecko_menu_page_38_body_0_line_1:0 "increases the underlying combat values, a fixed early bonus would become relatively weaker. Later policy tiers"
 gecko_menu_page_38_body_0_line_2:0 "raise the flat bonus to keep it relevant."
 gecko_menu_page_38_heading_1:0 "§YUpgrade the policy manually§!"
 gecko_menu_page_38_body_1:0 "When a new tier unlocks, §Ydeactivate the old policy and activate the higher-level version§!. It does not upgrade"
 gecko_menu_page_38_body_1_line_1:0 "itself. The tiers exclude one another, so the old active version blocks the new one until removed."
 gecko_menu_page_38_heading_2:0 "§YTechnology thresholds§!"
 gecko_menu_page_38_body_2:0 "Many tiers change at §YMIL 15 and 22§!. Black Chamber changes at §YMIL 16 and 22§!, raising flat artillery fire"
 gecko_menu_page_38_body_2_line_1:0 "from §G+0.4 to +1.0 to +1.5§!. Review the policy panel after reaching a threshold."
 gecko_menu_page_38_number:0 "Ideas & Policies • 3 / 5"
 gecko_menu_page_39_title:0 "§YInfrastructure Ideas: growing returns§!"
 gecko_menu_page_39_lead:0 "Turn selected provinces into increasingly efficient economic and recruitment centres."
 gecko_menu_page_39_heading_0:0 "§YConcentrate investment§!"
 gecko_menu_page_39_body_0:0 "Infrastructure rewards deep investment in developed provinces: repeat expansions, buildings and Provincial"
 gecko_menu_page_39_body_0_line_1:0 "Investment reinforce one another."
 gecko_menu_page_39_heading_1:0 "§YThe completed-group bonus§!"
 gecko_menu_page_39_body_1:0 "Completing Infrastructure unlocks an extra provincial bonus for §Y1-5 infrastructure expansions§!. A higher tier"
 gecko_menu_page_39_body_1_line_1:0 "replaces the previous extra tier and is added to the ordinary expansion bonuses."
 gecko_menu_page_39_heading_2:0 "§YIncreasing returns§!"
 gecko_menu_page_39_body_2:0 "For §Y1 / 2 / 3 expansions§!, the extra tier alone gives §G+5 / +15 / +30% goods produced§! and §G+10 / +30 / +60%§!"
 gecko_menu_page_39_body_2_line_1:0 "§Gmanpower§!. The extra production and tax bonuses are §G+7.5 / +23 / +45%§!. Gains accelerate: two or three"
 gecko_menu_page_39_body_2_line_2:0 "expansions are more rewarding than spreading single expansions widely."
 gecko_menu_page_39_heading_3:0 "§YImproving capacity efficiency§!"
 gecko_menu_page_39_body_3:0 "Including the ordinary expansion costs, §Y1 / 2 / 3 expansions§! add §Y+35 / +55 / +75 flat local governing cost§!,"
 gecko_menu_page_39_body_3_line_1:0 "while their net local governing-cost modifier becomes §G-5 / -10 / -15%§!. The first tier pays the largest upfront"
 gecko_menu_page_39_body_3_line_2:0 "premium; later tiers add less flat cost and stronger percentage relief. Actual capacity use also depends on the"
 gecko_menu_page_39_body_3_line_3:0 "province and other modifiers."
 gecko_menu_page_39_number:0 "Ideas & Policies • 4 / 5"
 gecko_menu_page_40_title:0 "§YInfrastructure Ideas: buildings and hubs§!"
 gecko_menu_page_40_lead:0 "The custom effects make existing provincial investments more valuable."
 gecko_menu_page_40_heading_0:0 "§YEfficient Construction Plans§!"
 gecko_menu_page_40_body_0:0 "Adds a separate development-cost-modifier discount matching the building tier: §G-3 / -5 / -7 / -9 / -11 / -15%§!"
 gecko_menu_page_40_body_0_line_1:0 "for §Y1-6 buildings§!. This is on top of the ordinary building-investment discount: at 1, 3 and 6 buildings the"
 gecko_menu_page_40_body_0_line_2:0 "combined discount is §G-4.5 / -10.5 / -22.5%§!."
 gecko_menu_page_40_heading_1:0 "§YRegulation Bureau§!"
 gecko_menu_page_40_body_1:0 "The fourth Infrastructure idea upgrades eligible Provincial Investment hubs with §G+1 flat goods produced§!, at §Y+5§!"
 gecko_menu_page_40_body_1_line_1:0 "§Yflat local governing cost§!. This increases actual output; it is not +1 base production development. It applies to"
 gecko_menu_page_40_body_1_line_2:0 "the grain, livestock, naval-supplies and cloth production hubs."
 gecko_menu_page_40_heading_2:0 "§YExisting provinces benefit too§!"
 gecko_menu_page_40_body_2:0 "Acquiring the relevant ideas updates existing buildings and hubs. New infrastructure expansions and provincial"
 gecko_menu_page_40_body_2_line_1:0 "changes refresh their matching bonuses; removing the ideas removes the extra effects."
 gecko_menu_page_40_number:0 "Ideas & Policies • 5 / 5"
 gecko_menu_page_41_title:0 "§YSmall powers and imperial ambition§!"
 gecko_menu_page_41_lead:0 "Several major triggered bonuses depend on your position and diplomacy."
 gecko_menu_page_41_heading_0:0 "§YRising Power§!"
 gecko_menu_page_41_body_0:0 "Human non-colonial countries below §Y400 own and non-tributary subject development§! can qualify. The"
 gecko_menu_page_41_body_0_line_1:0 "Emperor is excluded; a country must be in the HRE or not a Great Power. Benefits include cheaper advisors,"
 gecko_menu_page_41_body_0_line_2:0 "mercenaries and forts, plus reduced aggressive expansion."
 gecko_menu_page_41_heading_1:0 "§YImperial Ambition§!"
 gecko_menu_page_41_body_1:0 "Qualifying non-Great-Power, non-hegemon, non-colonial countries with current institutions gain manpower"
 gecko_menu_page_41_body_1_line_1:0 "recovery, cheaper reinforcements and forts, and mercenary capacity. Normally you may have no human ally"
 gecko_menu_page_41_body_1_line_2:0 "and at most one AI ally; Rising Power and the listed regional modifiers bypass that alliance check."
 gecko_menu_page_41_heading_2:0 "§YImperial Dominance§!"
 gecko_menu_page_41_body_2:0 "The qualifying top three Great Powers can receive §G-0.5 percentage points§! yearly army- and navy-tradition"
 gecko_menu_page_41_body_2_line_1:0 "decay, subject to institution, alliance and hegemon restrictions. This triggered modifier is separate from the"
 gecko_menu_page_41_body_2_line_2:0 "Imperial Administration event bonus."
 gecko_menu_page_41_number:0 "Powers & Reforms • 1 / 5"
 gecko_menu_page_42_title:0 "§YImperial Administration§!"
 gecko_menu_page_42_lead:0 "A permanent administrative reward for leading Great Powers."
 gecko_menu_page_42_heading_0:0 "§YImperial Administration§!"
 gecko_menu_page_42_body_0:0 "After the Age of Discovery, the qualifying §Y#1 Great Power§! below §Y101% governing-capacity use§! can receive"
 gecko_menu_page_42_body_0_line_1:0 "permanent §G+400 governing capacity and +1 accepted culture§!."
 gecko_menu_page_42_heading_1:0 "§YLosing standing§!"
 gecko_menu_page_42_body_1:0 "The follow-up administration event can replace the large bonus with §G+200 capacity and +1 accepted culture§! at"
 gecko_menu_page_42_body_1_line_1:0 "the lower Great-Power-rank condition. These are scripted event modifiers, distinct from the live Great-Power"
 gecko_menu_page_42_body_1_line_2:0 "tradition bonus."
 gecko_menu_page_42_number:0 "Powers & Reforms • 2 / 5"
 gecko_menu_page_43_title:0 "§YHegemony: requirements and economy§!"
 gecko_menu_page_43_lead:0 "Hegemony rewards have been redesigned from vanilla."
 gecko_menu_page_43_heading_0:0 "§YClaiming a hegemony§!"
 gecko_menu_page_43_body_0:0 "The usual thresholds remain §Y1,000 monthly income§! for Economic and §Y1,000 regiments§! for Military, with"
 gecko_menu_page_43_body_0_line_1:0 "Great-Power comparisons and national exceptions. Naval also requires §Y300 heavy ships§! in Gecko, alongside"
 gecko_menu_page_43_body_0_line_2:0 "its usual §Y500 total ships§!. Reduced-requirement countries still need the 300 heavies."
 gecko_menu_page_43_heading_1:0 "§YShared full-power reward§!"
 gecko_menu_page_43_body_1:0 "All three Gecko hegemonies grant §G-10% all power costs§! at maximum hegemony power. Their other rewards"
 gecko_menu_page_43_body_1_line_1:0 "differ by type and ramp up with power."
 gecko_menu_page_43_heading_2:0 "§YEconomic: construction and capacity§!"
 gecko_menu_page_43_body_2:0 "At full strength, Gecko gives §G+15% goods produced, +10% governing capacity and -15% construction cost§!,"
 gecko_menu_page_43_body_2_line_1:0 "plus the shared power-cost reduction. Vanilla instead offers +25% goods, +20% capacity, +10% mercenary"
 gecko_menu_page_43_body_2_line_2:0 "discipline and -20% minimum territory autonomy. The mercenary-discipline and territory-autonomy rewards"
 gecko_menu_page_43_body_2_line_3:0 "are replaced."
 gecko_menu_page_43_number:0 "Powers & Reforms • 3 / 5"
 gecko_menu_page_44_title:0 "§YHegemony: naval and military rewards§!"
 gecko_menu_page_44_lead:0 "Compare the rewritten rewards before choosing a hegemony."
 gecko_menu_page_44_heading_0:0 "§YNaval: durability and tradition§!"
 gecko_menu_page_44_body_0:0 "Gecko replaces vanilla's +200% blockade efficiency with §G+10% ship durability§!. At full power it grants §G+15%§!"
 gecko_menu_page_44_body_0_line_1:0 "§Gback-row artillery damage and +1 yearly naval tradition§!, plus -10% all power costs; vanilla grants +20%"
 gecko_menu_page_44_body_0_line_2:0 "back-row damage. The +200% sailors and -20 liberty desire scaling rewards remain."
 gecko_menu_page_44_heading_1:0 "§YMilitary: army size and morale§!"
 gecko_menu_page_44_body_1:0 "Gecko replaces vanilla's +1 monthly MIL with §G+25% spy defence§!. Full scaling gives §G-12.5% attrition, -2.5%§!"
 gecko_menu_page_44_body_1_line_1:0 "§Gregiment cost, +12.5% reinforcement speed, +10% siege ability and +1 yearly army tradition§!. Maximum"
 gecko_menu_page_44_body_1_line_2:0 "power adds §G+15% force limit, +10% army morale§! and the shared power-cost reduction."
 gecko_menu_page_44_heading_2:0 "§YMilitary: other differences§!"
 gecko_menu_page_44_body_2:0 "Vanilla's +10% movement speed and -3 unrest are absent; attrition reduction is 12.5% rather than 20%, and"
 gecko_menu_page_44_body_2_line_1:0 "siege ability is 10% rather than 20%. Gecko shifts the reward toward reinforcement, army tradition, force"
 gecko_menu_page_44_body_2_line_2:0 "limit and morale."
 gecko_menu_page_44_number:0 "Powers & Reforms • 4 / 5"
 gecko_menu_page_45_title:0 "§YHordes, militarization and national paths§!"
 gecko_menu_page_45_lead:0 "National governments can replace generic assumptions."
 gecko_menu_page_45_heading_0:0 "§YEarly steppe support§!"
 gecko_menu_page_45_body_0:0 "Human Sunni and Tengri nomads receive separate Steppe Rule modifiers at startup during Discovery. Both"
 gecko_menu_page_45_body_0_line_1:0 "grant unity and movement benefits; their cavalry-ratio bonuses differ. These modifiers are removed when"
 gecko_menu_page_45_body_0_line_2:0 "Discovery ends, so plan for the loss of temporary support."
 gecko_menu_page_45_heading_1:0 "§YHorde government is not a razing unlock§!"
 gecko_menu_page_45_body_1:0 "The active Steppe Horde reform does not enable razing, and horde unity has ongoing base and"
 gecko_menu_page_45_body_1_line_1:0 "development-scaled decay. Formables such as the Great Mongol State and Tatar states have distinct reforms;"
 gecko_menu_page_45_body_1_line_2:0 "evaluate their actual route instead of assuming a permanent 100-unity opening."
 gecko_menu_page_45_heading_2:0 "§YOther national systems§!"
 gecko_menu_page_45_body_2:0 "Prussian militarization has multiple mission-unlocked tiers. Its boost spends §Y50 MIL§! for §G10 militarization§!."
 gecko_menu_page_45_body_2_line_1:0 "Hungarian, Mughal, French and other reforms have national or historical-reform prerequisites; mission"
 gecko_menu_page_45_body_2_line_2:0 "previews help reveal alternative paths."
 gecko_menu_page_45_number:0 "Powers & Reforms • 5 / 5"
 gecko_menu_page_46_title:0 "§YReligion balance§!"
 gecko_menu_page_46_lead:0 "Faith mechanics and modifiers have been revised across the map."
 gecko_menu_page_46_heading_0:0 "§YTolerance and conversion§!"
 gecko_menu_page_46_body_0:0 "Base maximum tolerance of both heretics and heathens is §Y5§!. Conversion zeal lasts §Y1,825 days§! (5 years)."
 gecko_menu_page_46_body_0_line_1:0 "Religious Ideas also affect culture-conversion cost and time; faith decisions and national missions can add"
 gecko_menu_page_46_body_0_line_2:0 "further exceptions."
 gecko_menu_page_46_heading_1:0 "§YRebalanced faith identities§!"
 gecko_menu_page_46_body_1:0 "Sunni adds manpower, Shiite adds army morale, and Ibadi adds goods produced. Christian branches,"
 gecko_menu_page_46_body_1_line_1:0 "Buddhist schools, Shinto and other faiths also use the mod's own bonuses. Compare the actual religion screen"
 gecko_menu_page_46_body_1_line_2:0 "rather than assuming the vanilla reward package."
 gecko_menu_page_46_heading_2:0 "§YPiety and personal faith tools§!"
 gecko_menu_page_46_body_2:0 "Declaring the usual good/bad religious wars does not move piety through the ordinary declaration-of-war"
 gecko_menu_page_46_body_2_line_1:0 "rules, and new rulers retain the full piety percentage. Church aspects, icons, fervor, deities and blessings have"
 gecko_menu_page_46_body_2_line_2:0 "their own revised options and eligibility."
 gecko_menu_page_46_number:0 "Religion • 1 / 2"
 gecko_menu_page_47_title:0 "§YProtestant and Reformed faiths§!"
 gecko_menu_page_47_lead:0 "Permanent Protestant aspects and Reformed changes compared with vanilla."
 gecko_menu_page_47_heading_0:0 "§YProtestant aspects: permanent bonuses§!"
 gecko_menu_page_47_body_0:0 "All 16 aspects include their former 10-year bonus permanently while active. Removing an aspect removes both"
 gecko_menu_page_47_body_0_line_1:0 "bonuses. No separate timed zeal bonus needs renewal."
 gecko_menu_page_47_body_0_line_2:0 ""
 gecko_menu_page_47_heading_1:0 "§YReformed changes from vanilla§!"
 gecko_menu_page_47_body_1:0 "Country: §G-5% development cost§!. Focus cost: §Y8 to 6 fervor§!. Trade stays at +10% trade power/efficiency, +5%"
 gecko_menu_page_47_body_1_line_1:0 "goods. War: morale damage §G+5% to +10%§!; army/navy morale stays +10%. Stability: unrest §G-2 to -3§!, estate"
 gecko_menu_page_47_body_1_line_2:0 "loyalty §G+10% to +15%§!; §G+3 true-faith tolerance§! replaces -10% development cost. Diplomacy: +2 reputation"
 gecko_menu_page_47_number:0 "Religion • 2 / 2"
 gecko_menu_page_47_body_1_line_3:0 "unchanged; adds §G-25 subject liberty desire§!; improve relations §G+25% to +33%§!, spy-action cost §G-25% to -33%§!."
 gecko_menu_page_47_body_2_line_2:0 "the current province and mission tooltips for these contextual rewards."
 gecko_menu_page_48_title:0 "§YThe Great Khan and Legacy§!"
 gecko_menu_page_48_lead:0 "For Crimea and whoever currently holds the Mandate as Great Khan."
 gecko_menu_page_48_heading_0:0 "§YTradition of the Steppe§!"
 gecko_menu_page_48_body_0:0 "Gecko presents the mandate holder as the §YGreat Khan§!, Mandate as §YLegacy§!, and the system as §YTradition of the§!"
 gecko_menu_page_48_body_0_line_1:0 "§YSteppe§!. §YCrimea§! is the starting holder."
 gecko_menu_page_48_heading_1:0 "§YCrimea and the Golden Horde§!"
 gecko_menu_page_48_body_1:0 "Crimea can form the §YGolden Horde§! after passing §YUnite the Tatars§!, while remaining Great Khan and provided"
 gecko_menu_page_48_body_1_line_1:0 "the Golden Horde does not already exist. This makes the reform path a formation objective for Crimea."
 gecko_menu_page_48_number:0 "Great Khan • 1 / 2"
 gecko_menu_page_49_title:0 "§YKhanate Reforms and Horde Unity§!"
 gecko_menu_page_49_lead:0 "Manage Legacy and Horde Unity through the Great Khan interface."
 gecko_menu_page_49_heading_0:0 "§YKhanate Reforms§!"
 gecko_menu_page_49_body_0:0 "Khanate Reforms require and cost §Y75 Legacy§!, without the ordinary reform stability cost. Prosperity,"
 gecko_menu_page_49_body_0_line_1:0 "devastation, tributary development, loans and stability affect Legacy; high devastation and debt remain"
 gecko_menu_page_49_body_0_line_2:0 "especially dangerous."
 gecko_menu_page_49_heading_1:0 "§YUnite the Tatars: choose the timing§!"
 gecko_menu_page_49_body_1:0 "Passing §YUnite the Tatars§! blocks every still-unpassed Khanate Reform. Take it §Ylast§! to collect the other bonuses"
 gecko_menu_page_49_body_1_line_1:0 "first, or form the Golden Horde early and consciously forgo those remaining bonuses permanently. Already"
 gecko_menu_page_49_body_1_line_2:0 "passed reforms are retained."
 gecko_menu_page_49_heading_2:0 "§YHorde Unity§!"
 gecko_menu_page_49_body_2:0 "This system displays meritocracy as §YHorde Unity§!. With §YMandate of Heaven§!, the existing formation setup"
 gecko_menu_page_49_body_2_line_1:0 "enables it and sets it to §Y100§! for the Great Khan. Government reforms determine access to this resource."
 gecko_menu_page_49_number:0 "Great Khan • 2 / 2"
 gecko_menu_page_50_title:0 "§YAustria and the imperial army§!"
 gecko_menu_page_50_lead:0 "Imperial military strength grows through the reform sequence."
 gecko_menu_page_50_heading_0:0 "§YAustria at the start§!"
 gecko_menu_page_50_body_0:0 "Austria starts with §Y30,000 troops§!."
 gecko_menu_page_50_heading_1:0 "§YContributions to the Emperor§!"
 gecko_menu_page_50_body_1:0 "Each ordinary imperial prince contributes §G+0.1 force limit and +100 base manpower§!. These benefits belong to"
 gecko_menu_page_50_body_1_line_1:0 "the imperial office."
 gecko_menu_page_50_heading_2:0 "§YBuild through the upper reforms§!"
 gecko_menu_page_50_body_2:0 "The seven upper reforms add a cumulative §G+65 force limit and +65,000 base manpower§! to the Emperor. These"
 gecko_menu_page_50_body_2_line_1:0 "are capacity and manpower bonuses; filling the larger army still requires recruitment and maintenance."
 gecko_menu_page_50_number:0 "HRE • 1 / 8"
 gecko_menu_page_51_title:0 "§YAuthority, membership and reform paths§!"
 gecko_menu_page_51_lead:0 "Requires the §YEmperor§! DLC. Upper reforms and lower branches have different roles."
 gecko_menu_page_51_heading_0:0 "§YAuthority and branches§!"
 gecko_menu_page_51_body_0:0 "Reforms cost §Y60 Imperial Authority§!. Princes are much more willing to support reforms near this threshold"
 gecko_menu_page_51_body_0_line_1:0 "than in vanilla, so a reform can usually pass soon after you reach 60. The §Yleft branch decentralizes§! and the"
 gecko_menu_page_51_body_0_line_2:0 "§Yright branch centralizes§!; choosing one excludes the other."
 gecko_menu_page_51_heading_1:0 "§YReligious and territorial pressure§!"
 gecko_menu_page_51_body_1:0 "Heretic princes no longer impose the ordinary Imperial Authority penalty. Foreign control of imperial"
 gecko_menu_page_51_body_1_line_1:0 "territory still reduces authority. Keep the Empire intact when planning a reform sequence."
 gecko_menu_page_51_heading_2:0 "§YHuman HRE electors§!"
 gecko_menu_page_51_body_2:0 "At startup, human HRE members who are not already electors are made electors, except Austria. A"
 gecko_menu_page_51_body_2_line_1:0 "permanent-departure restriction can prevent a country from rejoining the Empire."
 gecko_menu_page_51_number:0 "HRE • 2 / 8"
 gecko_menu_page_52_title:0 "§YUpper reforms: I-III§!"
 gecko_menu_page_52_lead:0 "Each of these reforms grants the Emperor §G+5 force limit and +5,000 base manpower§!."
 gecko_menu_page_52_heading_0:0 "§YI - Call for Reichsreform§!"
 gecko_menu_page_52_body_0:0 "Imperial provinces receive §G-0.05 monthly autonomy change§!."
 gecko_menu_page_52_heading_1:0 "§YII - Institute Reichsregiment§!"
 gecko_menu_page_52_body_1:0 "The Emperor gains §G+2 diplomatic reputation§!. Imperial provinces gain §G-2.5% construction and development§!"
 gecko_menu_page_52_body_1_line_1:0 "§Gcosts§!."
 gecko_menu_page_52_heading_2:0 "§YIII - Absolute Reichsstabilität§!"
 gecko_menu_page_52_body_2:0 "Imperial provinces gain §G-25% state maintenance, -0.1 monthly devastation and +0.1 monthly prosperity§!"
 gecko_menu_page_52_body_2_line_1:0 "§Ggrowth§!. The Emperor also unlocks Expand Empire against eligible targets."
 gecko_menu_page_52_number:0 "HRE • 3 / 8"
 gecko_menu_page_53_title:0 "§YUpper reforms: IV-VII§!"
 gecko_menu_page_53_lead:0 "IV-VI: §G+10 force limit / +10,000 manpower§! each. VII: §G+20 / +20,000§!."
 gecko_menu_page_53_heading_0:0 "§YIV - Enact Gemeiner Pfennig§!"
 gecko_menu_page_53_body_0:0 "Emperor: §G+36 yearly tax income§!. All imperial countries: §G+2 diplomatic reputation§!."
 gecko_menu_page_53_heading_1:0 "§YV - Perpetual Diet§!"
 gecko_menu_page_53_body_1:0 "Establishes the §YPerpetual Diet§! in an eligible imperial capital."
 gecko_menu_page_53_heading_2:0 "§YVI - Create the Landsknechtswesen§!"
 gecko_menu_page_53_body_2:0 "All imperial countries gain §G-25% Imperial mercenary cost§!."
 gecko_menu_page_53_heading_3:0 "§YVII - Ewiger Landfriede§!"
 gecko_menu_page_53_body_3:0 "Emperor: §G+5% army morale and +0.5 yearly prestige§!. All imperial countries: §G-5% technology cost§!. Imperial"
 gecko_menu_page_53_body_3_line_1:0 "provinces: §G+10% institution spread§!."
 gecko_menu_page_53_number:0 "HRE • 4 / 8"
 gecko_menu_page_54_title:0 "§YDecentralization: electors and resources§!"
 gecko_menu_page_54_lead:0 "The left branch spreads benefits across the Emperor, electors and imperial provinces."
 gecko_menu_page_54_heading_0:0 "§YEstablish the Reichstag Collegia§!"
 gecko_menu_page_54_body_0:0 "Emperor: §G-5% construction cost and +96 yearly tax income§!. Electors: §G-5% advisor cost§!."
 gecko_menu_page_54_heading_1:0 "§YExpand the Gemeiner Pfennig§!"
 gecko_menu_page_54_body_1:0 "Emperor: §G+15,000 base manpower§!. Electors: §G+5,000 base manpower and +72 yearly tax income§!."
 gecko_menu_page_54_heading_2:0 "§YEmbrace Rechenschaft Measures§!"
 gecko_menu_page_54_body_2:0 "Emperor: §G+15 force limit§!. Electors: §G+5 force limit§!. Imperial provinces: §G+5% production efficiency§!."
 gecko_menu_page_54_number:0 "HRE • 5 / 8"
 gecko_menu_page_55_title:0 "§YDecentralization: the final reforms§!"
 gecko_menu_page_55_lead:0 "The late left branch supports development and a distributed military network."
 gecko_menu_page_55_heading_0:0 "§YGeteilte Macht§!"
 gecko_menu_page_55_body_0:0 "Emperor: §G-10% advisor cost§!. All imperial countries: §G-5% technology cost§!. Imperial provinces: §G-2.5%§!"
 gecko_menu_page_55_body_0_line_1:0 "§Gdevelopment cost§!."
 gecko_menu_page_55_heading_1:0 "§YReichskrieg§!"
 gecko_menu_page_55_body_1:0 "Emperor: §G+10% income from vassals and +50% vassal force-limit contribution§!. All imperial countries: §G+2.5%§!"
 gecko_menu_page_55_body_1_line_1:0 "§Garmy morale§!. Imperial provinces: §G+25% manpower§!."
 gecko_menu_page_55_heading_2:0 "§YDefense of the Empire§!"
 gecko_menu_page_55_body_2:0 "After Reichskrieg, the Emperor and electors gain §G-100% war taxes cost§! while at war with a country outside the"
 gecko_menu_page_55_body_2_line_1:0 "Empire."
 gecko_menu_page_55_number:0 "HRE • 6 / 8"
 gecko_menu_page_56_title:0 "§YCentralization: imperial administration§!"
 gecko_menu_page_56_lead:0 "The right branch concentrates its major administrative benefits in the Emperor."
 gecko_menu_page_56_heading_0:0 "§YReform the Hofgericht§!"
 gecko_menu_page_56_body_0:0 "Emperor: §G-10% construction cost§!. This first centralizing reform excludes the decentralizing branch."
 gecko_menu_page_56_heading_1:0 "§YCurtail the Imperial Estates§!"
 gecko_menu_page_56_body_1:0 "Emperor: §G-5% all power costs§!."
 gecko_menu_page_56_heading_2:0 "§YProclaim Erbkaisertum§!"
 gecko_menu_page_56_body_2:0 "Emperor: §G+25% Imperial Authority growth, +20% manpower recovery and +4 diplomatic relations§!."
 gecko_menu_page_56_number:0 "HRE • 7 / 8"
 gecko_menu_page_57_title:0 "§YCentralization: the final reforms§!"
 gecko_menu_page_57_lead:0 "Use the active Gecko rewards when comparing the two branches."
 gecko_menu_page_57_heading_0:0 "§YRevoke The Privilegia§!"
 gecko_menu_page_57_body_0:0 "Emperor: §G-10% advisor cost§!. Imperial members gain §G-10% stability cost§!."
 gecko_menu_page_57_heading_1:0 "§YRenovatio Imperii§!"
 gecko_menu_page_57_body_1:0 "Emperor: §G+10% army morale§!."
 gecko_menu_page_57_heading_2:0 "§YGecko changes the late rewards§!"
 gecko_menu_page_57_body_2:0 "Hereditary succession, automatic mass vassalization and imperial unification are disabled in these reform"
 gecko_menu_page_57_body_2_line_1:0 "definitions. Plan the centralization route around its administrative, recovery and morale bonuses."
 gecko_menu_page_57_number:0 "HRE • 8 / 8"
