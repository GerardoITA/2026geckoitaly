 gecko_menu_page_0_title:0 "§YWelcome to Gecko§!"
 gecko_menu_page_0_lead:0 "A practical guide to the rules that change campaign planning."
 gecko_menu_page_0_heading_0:0 "§YYour first checks§!"
 gecko_menu_page_0_body_0:0 "Review government reforms, estates and your mission tree before spending power. Many national systems depend on\na mission, reform, culture or DLC; a bonus described for one country is not a universal unlock."
 gecko_menu_page_0_heading_1:0 "§YUseful interfaces§!"
 gecko_menu_page_0_body_1:0 "Court Recruitment selects advisors and exploration leaders. Province buttons create trade centres and production\nhubs. Hover mission-preview controls to inspect alternative mission paths before choosing them."
 gecko_menu_page_0_heading_2:0 "§YDecision helpers§!"
 gecko_menu_page_0_body_2:0 "Building helpers locate missing production or manpower buildings, inefficient temples and provinces without free\nslots. Some appear only after technology requirements are met. Hide/Show Extra Decisions controls the extra\nhelpers."
 gecko_menu_page_0_number:0 "Getting Started • 1 / 2"
 gecko_menu_page_1_title:0 "§YMap and strategic provinces§!"
 gecko_menu_page_1_lead:0 "Use the actual map and province tooltips when planning expansion."
 gecko_menu_page_1_heading_0:0 "§YChanged geography§!"
 gecko_menu_page_1_body_0:0 "Kent-Calais, Gibraltar-Ceuta and Tajura-Mokha are direct land links. Additional island routes connect the\nMediterranean, Indian Ocean and Caribbean. Hormuz-mainland and Hormuz-Qawasim are strait crossings."
 gecko_menu_page_1_heading_1:0 "§YCritical province bonuses§!"
 gecko_menu_page_1_body_1:0 "Certain strategic provinces grant military or economic bonuses while their activation conditions hold. Occupation,\ncountry identity and control of the surrounding area may matter; owning the named city alone is not always sufficient."
 gecko_menu_page_1_heading_2:0 "§YExamples§!"
 gecko_menu_page_1_body_2:0 "Constantinople can reward a qualifying non-Ottoman owner with combat and tax bonuses. Jerusalem grants a\nmissionary to specified Christian and Muslim religions. Check the province modifier tooltip for the exact local\nconditions."
 gecko_menu_page_1_number:0 "Getting Started • 2 / 2"
 gecko_menu_page_2_title:0 "§YGoverning capacity§!"
 gecko_menu_page_2_lead:0 "Staying within capacity is a central economic and military constraint."
 gecko_menu_page_2_heading_0:0 "§YUnder the limit§!"
 gecko_menu_page_2_body_0:0 "Unused governing capacity gives a scaling development-cost reduction, reaching §G-10%§! at the maximum unused share.\nThe benefit shrinks as capacity fills."
 gecko_menu_page_2_heading_1:0 "§YOver the limit§!"
 gecko_menu_page_2_body_1:0 "Penalties scale with the excess. At §Y100% over capacity§!: manpower §R-80%§!, administrative efficiency §R-25%§!, advisor cost\n§R+100%§! and state maintenance §R+150%§!, alongside other serious penalties."
 gecko_menu_page_2_heading_2:0 "§YExpand administration§!"
 gecko_menu_page_2_body_2:0 "Expand Administration grants §G150 governing capacity§! per use; its base reform-progress cost is §Y400§!. Centralizing a\nstate costs §Y200 ADM§! and takes §Y5 years§!. Buildings, reforms and subject management offer other ways to manage\ncapacity."
 gecko_menu_page_2_number:0 "Government • 1 / 4"
 gecko_menu_page_3_title:0 "§YEducate Ruler§!"
 gecko_menu_page_3_lead:0 "Improve low ruler skills directly from the Court interface."
 gecko_menu_page_3_heading_0:0 "§YWhere to click§!"
 gecko_menu_page_3_body_0:0 "Open the Court interface and click the ruler's ADM, DIP or MIL skill icon. The corresponding education button is\navailable only while that skill is below §Y3§!."
 gecko_menu_page_3_heading_1:0 "§YCost and result§!"
 gecko_menu_page_3_body_1:0 "Each click costs §Y20% of annual income§! (0.2 years) and adds §G+1§! to the selected skill. You must have enough ducats for\neach purchase. Repeat separately for ADM, DIP and MIL, up to §Y3 in each skill§!."
 gecko_menu_page_3_heading_2:0 "§YRestrictions and the decision§!"
 gecko_menu_page_3_body_2:0 "Governments with term elections, election on death, lottery elections or the merchant-republic attribute cannot use\nthese buttons. The Educate the Ruler decision only opens an explanation; training is performed through the skill\nicons."
 gecko_menu_page_3_number:0 "Government • 2 / 4"
 gecko_menu_page_4_title:0 "§YRulers and political institutions§!"
 gecko_menu_page_4_lead:0 "Government choice affects more than its listed modifiers."
 gecko_menu_page_4_heading_0:0 "§YReturn to parliament§!"
 gecko_menu_page_4_body_0:0 "Removing a parliament-granting reform starts a §Y10-year§! wait before adopting a parliament again. An existing\nparliament remains usable; the restriction concerns returning after removal."
 gecko_menu_page_4_heading_1:0 "§YGovernment changes§!"
 gecko_menu_page_4_body_1:0 "Changing reforms has a base cost of §Y10 reform progress§!. National reforms can lock a government tier or require a\npreviously acquired reform. Inspect available reforms before assuming a vanilla conversion route is possible."
 gecko_menu_page_4_number:0 "Government • 3 / 4"
 gecko_menu_page_5_title:0 "§YThe Empire and army reforms§!"
 gecko_menu_page_5_lead:0 "Government status can change both diplomacy and military specialization."
 gecko_menu_page_5_heading_0:0 "§YHuman HRE electors§!"
 gecko_menu_page_5_body_0:0 "At startup, human HRE members who are not already electors are made electors, except Austria. Free Cities can have\nup to §Y8 provinces§! under the global limit. A permanent-departure restriction can prevent a country from rejoining the\nEmpire."
 gecko_menu_page_5_heading_1:0 "§YMilitary reform choice§!"
 gecko_menu_page_5_body_1:0 "Noble Regiments grants §G+7.5% army morale and +1 possible policy§!. Professional Army grants §G+2.5% discipline, +0.5\nyearly army tradition and +0.1 percentage points of yearly professionalism§!. The listed colonial government forms\ncannot select these reforms."
 gecko_menu_page_5_number:0 "Government • 4 / 4"
 gecko_menu_page_6_title:0 "§YEstates and crownland§!"
 gecko_menu_page_6_lead:0 "Estate privileges have been extensively rewritten."
 gecko_menu_page_6_heading_0:0 "§YLoyalty and power privileges§!"
 gecko_menu_page_6_body_0:0 "Base estate loyalty is §Y50§!. Many privileges grant no loyalty, while some still have positive or negative loyalty effects.\nThe standard Clergy ADM, Nobility MIL and Burgher DIP power privileges are disabled; do not plan a vanilla\nmana-privilege opening."
 gecko_menu_page_6_heading_1:0 "§YStarting crownland§!"
 gecko_menu_page_6_body_1:0 "Estate land is redistributed once for human players at the start. Opening crownland also depends on your country,\nreforms and existing land shares. Check the Estates screen before planning your first privileges and land interactions."
 gecko_menu_page_6_heading_2:0 "§YSelling titles§!"
 gecko_menu_page_6_body_2:0 "Sale of Titles has a §Y120-month§! cooldown. Its ordinary payout is based on §Y1.5 years§! of estate-land income;\ngovernment or mission exceptions can change the payout. Read the live tooltip before selling."
 gecko_menu_page_6_number:0 "Estates • 1 / 2"
 gecko_menu_page_7_title:0 "§YFinancial demand and conscription§!"
 gecko_menu_page_7_lead:0 "Powerful privileges come with conditions and opportunity costs."
 gecko_menu_page_7_heading_0:0 "§YMerchant Guild Financial Demand§!"
 gecko_menu_page_7_body_0:0 "With the required DLC, this privilege is selectable at peace with at least §Y10 loans§!. It grants an interest benefit but\nblocks declarations of war and adds §R+5% all power costs§!. Its cooldown is §Y5 years§!."
 gecko_menu_page_7_heading_1:0 "§YRenew or revoke§!"
 gecko_menu_page_7_body_1:0 "At cooldown expiry, the event offers renewal with §G+10 Burgher loyalty§! or removal with §R-10 loyalty§!. The privilege does\nnot simply disappear automatically."
 gecko_menu_page_7_heading_2:0 "§YForce Conscription§!"
 gecko_menu_page_7_body_2:0 "The Nobility privilege enables its dedicated troop-demand estate action. It is incompatible with the listed Tribal\nMilitary Service and Rajput alternatives. The action remains available while the privilege is held; check its tooltip for\nthe current manpower award."
 gecko_menu_page_7_number:0 "Estates • 2 / 2"
 gecko_menu_page_8_title:0 "§YCourt Recruitment§!"
 gecko_menu_page_8_lead:0 "Use the Court Recruitment button in the court interface."
 gecko_menu_page_8_heading_0:0 "§YChoose an advisor type§!"
 gecko_menu_page_8_body_0:0 "Administrative, diplomatic and military recruitment each require §Y25§! power in the corresponding category to enter the\nselection. The following event lets you choose a specific advisor type rather than waiting for the random pool."
 gecko_menu_page_8_heading_1:0 "§YExploration leaders§!"
 gecko_menu_page_8_body_1:0 "A foreign conquistador costs §Y0.2 years of income§!; a foreign explorer costs §Y0.1 years§!. Each is created with §Y10 tradition§!\nand has its own §Y5-year§! hiring cooldown. Colonial expansion is a separate option in the same court menu."
 gecko_menu_page_8_heading_2:0 "§YSplendid Court§!"
 gecko_menu_page_8_body_2:0 "During the Age of Discovery, a human non-colonial country at peace with at least one level-3 advisor receives §G-10%\nadvisor cost§! and §G-5% development cost§!. Losing the conditions removes the triggered benefit."
 gecko_menu_page_8_number:0 "Court & Advisors • 1 / 2"
 gecko_menu_page_9_title:0 "§YGreat advisor events§!"
 gecko_menu_page_9_lead:0 "Advisor events have their own requirements and cooldowns."
 gecko_menu_page_9_heading_0:0 "§YMilitary events§!"
 gecko_menu_page_9_body_0:0 "Army Reformer and Grand Captain events require a level-3 advisor and §YMilitary Technology 9§!. The Grand Captain's\naward options apply a §Y100-year§! cooldown; postponing instead applies a §Y10-year§! cooldown."
 gecko_menu_page_9_heading_1:0 "§YDo not assume repeatability§!"
 gecko_menu_page_9_body_1:0 "The Army Reformer does not share the Grand Captain's repeating cooldown. The Critical Events decision shows the\nrelevant availability checks for military and other major advisor events."
 gecko_menu_page_9_number:0 "Court & Advisors • 2 / 2"
 gecko_menu_page_10_title:0 "§YTwo kinds of golden age§!"
 gecko_menu_page_10_lead:0 "Military and economic golden-age benefits are separate."
 gecko_menu_page_10_heading_0:0 "§YMilitary golden era§!"
 gecko_menu_page_10_body_0:0 "The ordinary golden-era modifier gives §G+10% army and navy morale§!, §G+1 maximum general fire and shock§!, and §G+25\nmaximum absolutism and revolutionary zeal§!. Its listed bonuses do not include the vanilla all-power-cost reduction."
 gecko_menu_page_10_heading_1:0 "§YEconomic golden age§!"
 gecko_menu_page_10_body_1:0 "The economic button requires §Y100 ADM, 100 DIP, 100 MIL and 200 splendor§!. It applies Urbanisation for §Y50 years§!:\n§G-10% all power costs§! and §G+10% goods produced§!. It is available separately from the military golden era, with a\ncountry-specific eligibility check for Portugal."
 gecko_menu_page_10_heading_2:0 "§YInvest splendor§!"
 gecko_menu_page_10_body_2:0 "The extra age-interface button converts §Y800 splendor§! into §G50 government reform progress§!. Age abilities and national\nage bonuses also differ from vanilla; inspect their current tooltips before committing splendor."
 gecko_menu_page_10_number:0 "Ages & Splendor • 1 / 1"
 gecko_menu_page_11_title:0 "§YBuildings support development§!"
 gecko_menu_page_11_lead:0 "Infrastructure decisions affect both output and future investment."
 gecko_menu_page_11_heading_0:0 "§YBuilding investment discount§!"
 gecko_menu_page_11_body_0:0 "For §Y1 / 2 / 3 / 4 / 5 / 6 buildings§!, the base development-cost-modifier discounts are §G1.5 / 2.5 / 3.5 / 4.5 / 5.5 /\n7.5%§!. This is a tiered schedule, not a flat 1.25% per building. Infrastructure Ideas can add a separate matching\ninvestment bonus."
 gecko_menu_page_11_heading_1:0 "§YMilitary buildings§!"
 gecko_menu_page_11_body_1:0 "Barracks grant §G+250 flat manpower§! on livestock, in addition to their normal modifier. Regimental Camps give §G+0.75\nforce limit§! plus §G+0.25§! on grain. The Armoury costs §Y250 ducats§! and grants §G+2 force limit and +500 manpower§!."
 gecko_menu_page_11_heading_2:0 "§YArmoury requirement§!"
 gecko_menu_page_11_body_2:0 "The Armoury's build trigger checks §Y30 development across the area§!, rather than requiring a single 30-development\nprovince. Its construction takes §Y60 months§!. Building-generated development is conditional on a country unlock, not\nuniversal."
 gecko_menu_page_11_number:0 "Economy & Buildings • 1 / 4"
 gecko_menu_page_12_title:0 "§YCourthouses and production hubs§!"
 gecko_menu_page_12_lead:0 "Use the province interface for targeted economic upgrades."
 gecko_menu_page_12_heading_0:0 "§YCourthouses§!"
 gecko_menu_page_12_body_0:0 "Besides reducing governing costs and autonomy, courthouses activate terrain-specific development investment\nbonuses. The discount depends on your province's terrain; inspect its modifier tooltip when choosing where to\ndevelop."
 gecko_menu_page_12_heading_1:0 "§YProvincial Assessment§!"
 gecko_menu_page_12_body_1:0 "A full state core with §Y10 base production§! and a production building can be assessed for §Y200 ducats + 50 DIP§!. Eligible\ngoods are wool, grain, livestock and naval supplies. Each province can be assessed once, with a §Y10-year country\ncooldown§!."
 gecko_menu_page_12_heading_2:0 "§YWhat changes§!"
 gecko_menu_page_12_body_2:0 "Wool changes to cloth; the other eligible goods receive their corresponding permanent production-hub modifiers.\nRegulation Bureau adds a further hub bonus when its Infrastructure Ideas requirement is satisfied."
 gecko_menu_page_12_number:0 "Economy & Buildings • 2 / 4"
 gecko_menu_page_13_title:0 "§YDebt, bankruptcy and state edicts§!"
 gecko_menu_page_13_lead:0 "Financing and administration directly affect wartime strength."
 gecko_menu_page_13_heading_0:0 "§YLoans and inflation§!"
 gecko_menu_page_13_body_0:0 "Each bank loan adds §R+0.5% building cost§! and §R-0.6% mercenary force-limit modifier§!. Each point of inflation adds\n§R-2% mercenary force-limit modifier§! and §R-1% mercenary discipline§!, alongside its other cost increases."
 gecko_menu_page_13_heading_1:0 "§YBankruptcy§!"
 gecko_menu_page_13_body_1:0 "Human players must have §Y+3 stability§! to declare bankruptcy. Its penalties include §R-50% army and navy morale§! and\n§R-100% manpower and sailor recovery§!. Treat debt control as part of military preparation."
 gecko_menu_page_13_heading_2:0 "§YEdicts§!"
 gecko_menu_page_13_body_2:0 "The ordinary edict lock is §Y1 month§!. Additional age-specific edicts require a government unlock. Clearing edicts\nthrough bulk management introduces a separate §Y33-day§! restriction. State Integration reduces separatism; late-game\nUrbanization boosts goods produced."
 gecko_menu_page_13_number:0 "Economy & Buildings • 3 / 4"
 gecko_menu_page_14_title:0 "§YExpand Infrastructure§!"
 gecko_menu_page_14_lead:0 "Concentrating investment improves a province but consumes governing capacity."
 gecko_menu_page_14_heading_0:0 "§YLocal benefits§!"
 gecko_menu_page_14_body_0:0 "Each expansion grants §G+1 building slot and +1 manufactory slot§!, §G-10% development cost§!, §G+5% goods produced§!, and\nseveral tax, production, manpower and recruitment benefits. It also adds §G+0.75 land and +1 naval force limit§!."
 gecko_menu_page_14_heading_1:0 "§YGoverning-cost trade-off§!"
 gecko_menu_page_14_body_1:0 "The same expansion adds §R+10 flat local governing cost and +10% local governing cost§!. Compare the economic gain\nwith your remaining national capacity: exceeding the cap can outweigh the local development discount."
 gecko_menu_page_14_number:0 "Economy & Buildings • 4 / 4"
 gecko_menu_page_15_title:0 "§YBuild and upgrade trade centres§!"
 gecko_menu_page_15_lead:0 "Trade centres now have five levels."
 gecko_menu_page_15_heading_0:0 "§YCreate a Trade Centre§!"
 gecko_menu_page_15_body_0:0 "At peace, the province button requires a §Y30-development full state core§!, a marketplace or upgrade, and no existing\ncentre in its area. Standard cost: §Y200 ducats + 50 DIP§!; in North or South America: §Y500 ducats + 100 DIP§!."
 gecko_menu_page_15_heading_1:0 "§YNew centre and upgrades§!"
 gecko_menu_page_15_body_1:0 "Creation grants a level-1 centre and §G+2 base production§!. Base upgrade costs for levels §Y2 / 3 / 4 / 5§! are §Y200 / 500 /\n1,000 / 1,500 ducats§!. Both inland and coastal centres use this five-level progression."
 gecko_menu_page_15_heading_2:0 "§YBeyond local trade power§!"
 gecko_menu_page_15_body_2:0 "Higher levels also improve their state: development cost, manpower, sailors, trade value and building slots vary by\ntier. Level 5 grants a national naval-tradition-decay benefit. Read whether a bonus applies to the province, state or\ncountry."
 gecko_menu_page_15_number:0 "Trade • 1 / 2"
 gecko_menu_page_16_title:0 "§YTrade networks and monopolies§!"
 gecko_menu_page_16_lead:0 "The trade map and regional resources deserve a fresh assessment."
 gecko_menu_page_16_heading_0:0 "§YRoutes and investments§!"
 gecko_menu_page_16_body_0:0 "Trade nodes and connections have been reworked. Plan merchants from the mod's trade map rather than a vanilla\nroute diagram. Trade-company investments distinguish company-province bonuses from benefits applying to the\nwhole area."
 gecko_menu_page_16_heading_1:0 "§YAfrican resources§!"
 gecko_menu_page_16_body_1:0 "Owning African slave or gold provinces can unlock additional triggered benefits. Stronger monopoly variants require\nall African provinces of that trade good; smaller variants use ownership thresholds. These are ownership conditions,\nnot ordinary trading-in bonuses."
 gecko_menu_page_16_heading_2:0 "§YRegional conditions§!"
 gecko_menu_page_16_body_2:0 "Italian Riches, Berber Raids and Stop the Raids use specific country, institution and regional-ownership\nrequirements. Their tooltips are the reference for whether your campaign qualifies; simply being located in the region\nis insufficient."
 gecko_menu_page_16_number:0 "Trade • 2 / 2"
 gecko_menu_page_17_title:0 "§YMilitary planning§!"
 gecko_menu_page_17_lead:0 "Technology, tradition and professionalism have been rebalanced."
 gecko_menu_page_17_heading_0:0 "§YArmy tradition§!"
 gecko_menu_page_17_body_0:0 "At §Y100 Army Tradition§!, its scaled modifier includes §G+15% land force limit§! and §G+15% mercenary force-limit\nmodifier§!, alongside morale, recovery, siege and other bonuses. Tradition also contributes yearly professionalism."
 gecko_menu_page_17_heading_1:0 "§YProfessionalism§!"
 gecko_menu_page_17_body_1:0 "The thresholds remain §Y20 / 40 / 60 / 80 / 100%§!. Supply depots unlock at 20%, garrison refill at 40% and manpower\nreturn on disband at 60%. Later tiers add cumulative general-cost and drill-gain benefits."
 gecko_menu_page_17_heading_2:0 "§YRead current technology§!"
 gecko_menu_page_17_body_2:0 "Military technology and unit pips differ from vanilla. Tactics and combat improvements are distributed through the\ntechnology tree; idea groups and some policies can also grant tactics. Compare the current technology and unit\ntooltips before timing a war."
 gecko_menu_page_17_number:0 "Army & Technology • 1 / 3"
 gecko_menu_page_18_title:0 "§YCombat and siege rules§!"
 gecko_menu_page_18_lead:0 "Several global values change the pace of warfare."
 gecko_menu_page_18_heading_0:0 "§YSieges and barrages§!"
 gecko_menu_page_18_body_0:0 "Base garrisons contain §Y3,000 men per fort level§!. The siege-force requirement uses a §Y0.334§! multiplier. Artillery\nbarrages cost §Y25 MIL§! and naval barrages §Y15 MIL§! before modifiers; assault power cost is §Y0§!."
 gecko_menu_page_18_heading_1:0 "§YWar score§!"
 gecko_menu_page_18_body_1:0 "The default ticking-war-score rate is §Y0.7§!, capped at §Y40§!. Battles can contribute up to §Y50 war score§!. Individual Casus\nBelli and war goals can override their relevant rules."
 gecko_menu_page_18_heading_2:0 "§YDrill and the back row§!"
 gecko_menu_page_18_body_2:0 "Yearly drill gain is §Y30§!. Back-row artillery takes §Y0§! strength and morale damage through the back-row damage\nmultipliers. These rules do not protect artillery once it is forced into the front row."
 gecko_menu_page_18_number:0 "Army & Technology • 2 / 3"
 gecko_menu_page_19_title:0 "§YSpecial land units§!"
 gecko_menu_page_19_lead:0 "Special units have distinct roles and drawbacks; availability remains conditional."
 gecko_menu_page_19_heading_0:0 "§YFire and assault troops§!"
 gecko_menu_page_19_body_0:0 "Janissaries gain §G+5% fire damage§! and better assaults and drilling, but pay §R+100% reinforcement cost§!. Streltsy gain\n§G+10% fire damage§! and §G-10% fire damage received§!. Musketeers gain §G+15% fire damage§!."
 gecko_menu_page_19_heading_1:0 "§YDefensive and cavalry roles§!"
 gecko_menu_page_19_body_1:0 "Tercios reduce shock damage received by §G30%§! and morale damage received by §G10%§!. Winged Hussars gain cavalry\nshock and morale damage but reinforce more slowly. Banners trade slower reinforcement for discipline and lower\nmanpower and maintenance use."
 gecko_menu_page_19_heading_2:0 "§YOther regional troops§!"
 gecko_menu_page_19_body_2:0 "Cawa improve attrition, resilience and reinforcement; Samurai gain discipline and morale resilience at higher\nreinforcement cost. Rajputs reinforce cheaply and retain drill; Mamluks and Qizilbash have different offensive or\nmaintenance advantages. Inspect the actual regiment tooltip."
 gecko_menu_page_19_number:0 "Army & Technology • 3 / 3"
 gecko_menu_page_20_title:0 "§YA separate recruitment system§!"
 gecko_menu_page_20_lead:0 "Gecko mercenary decisions recruit individual regiments and bulk batches."
 gecko_menu_page_20_heading_0:0 "§YWho can recruit?§!"
 gecko_menu_page_20_body_0:0 "The mercenary recruitment and unit-type decisions require a §Yhuman, independent, non-bankrupt§! country. Choose\ninfantry or cavalry and recruit one regiment or a batch. The initial four bulk tiers represent shares of your mercenary\nlimit, capped by available capacity."
 gecko_menu_page_20_heading_1:0 "§YMercenary force limit§!"
 gecko_menu_page_20_body_1:0 "The development-based system starts from §Y6 + 0.075 × total development × (1 - average autonomy / 100)§!. A country\nwith Rising Power adds §Y4§! before the mercenary-manpower modifier is applied. Ordinary land-force-limit modifiers\nare not the basis of this calculation."
 gecko_menu_page_20_heading_2:0 "§YWhere troops appear§!"
 gecko_menu_page_20_body_2:0 "The preferred spawn is your controlled capital, with no siege or battle. Otherwise the system looks for a controlled\nowned province without siege/battle and without a neighbouring owned province outside your control."
 gecko_menu_page_20_number:0 "Mercenaries • 1 / 2"
 gecko_menu_page_21_title:0 "§YMercenary costs and readiness§!"
 gecko_menu_page_21_lead:0 "Plan treasury, professionalism and debt before recruiting."
 gecko_menu_page_21_heading_0:0 "§YDucat cost§!"
 gecko_menu_page_21_body_0:0 "Base recruitment is §Y30 ducats§! per infantry regiment. Cavalry uses a §Y2.5×§! multiplier. Mercenary-cost reductions apply,\nwith a reduction floor of §Y-90%§!. Existing mercenary companies also count when checking the number of owned\nmercenaries."
 gecko_menu_page_21_heading_1:0 "§YProfessionalism cost§!"
 gecko_menu_page_21_body_1:0 "Without a waiver, a recruited regiment costs §Y0.20 / 0.16 / 0.12 / 0.08 / 0.04 percentage points§! of professionalism\nacross the pre-1520 / 1520 / 1580 / 1630 / 1680 brackets. The half-cost branch uses earlier later thresholds: §Y1570 /\n1620 / 1670§!."
 gecko_menu_page_21_heading_2:0 "§YAvoid emergency debt spirals§!"
 gecko_menu_page_21_body_2:0 "Loans reduce the mercenary-limit modifier, inflation reduces both the limit and mercenary discipline, and high\ngoverning-capacity excess damages your wider economy. Recruiting a batch does not remove these ongoing penalties."
 gecko_menu_page_21_number:0 "Mercenaries • 2 / 2"
 gecko_menu_page_22_title:0 "§YNaval planning§!"
 gecko_menu_page_22_lead:0 "Ships, sailors and doctrines have their own balance changes."
 gecko_menu_page_22_heading_0:0 "§YCosts and transport§!"
 gecko_menu_page_22_body_0:0 "Base heavy-ship cost is §Y35 ducats§!; base transport cost is §Y1 ducat§! and §Y1 sailor§!. Naval force-limit overage uses a §Y4×§!\nextra-cost factor, making an oversized fleet expensive."
 gecko_menu_page_22_heading_1:0 "§YNaval doctrines§!"
 gecko_menu_page_22_body_1:0 "The minimum naval force limit for doctrines is §Y15§!. Switching uses §Y5% of sailors§! through the doctrine-switch cost\ndefine. Generic and national doctrines have been rewritten; for example Free Oarsmen grants marine capacity, while\nMerchant Navy improves ship-power propagation."
 gecko_menu_page_22_heading_2:0 "§YMarines§!"
 gecko_menu_page_22_body_2:0 "Marines are enabled in the base country values. Their regiment modifier improves disembarkation and reduces shock\ndamage received. Your allowed fraction and recruitment access still depend on modifiers, ideas, doctrines and\nnational systems."
 gecko_menu_page_22_number:0 "Navy • 1 / 2"
 gecko_menu_page_23_title:0 "§YSpecial ships§!"
 gecko_menu_page_23_lead:0 "A special ship is not interchangeable with an ordinary hull."
 gecko_menu_page_23_heading_0:0 "§YBattle ships§!"
 gecko_menu_page_23_body_0:0 "Men of War gain §G+50% cannons§!. Galleons gain §G+10% hull size§!; Galleasses gain §G+10% galley combat ability§!.\nMaritime Ideas can unlock a small Men-of-War fraction."
 gecko_menu_page_23_heading_1:0 "§YTrade and transport ships§!"
 gecko_menu_page_23_body_1:0 "Special Caravels improve fleet speed and trade power while reducing attrition. VOC Indiamen combine extra\ncannons and trade power with transport capability. Geobukseon also have transport and movement properties; inspect\ntheir unusual combat modifiers before deploying them."
 gecko_menu_page_23_number:0 "Navy • 2 / 2"
 gecko_menu_page_24_title:0 "§YAlliance and peace rules§!"
 gecko_menu_page_24_lead:0 "Diplomacy has restrictions that do not appear in vanilla planning guides."
 gecko_menu_page_24_heading_0:0 "§YRe-forming a broken alliance§!"
 gecko_menu_page_24_body_0:0 "For human participants, alliance formation is blocked while either relevant Broke Alliance or wartime-break opinion\nmodifier remains. Wait for the modifier itself to disappear; this is not a fixed truce timer."
 gecko_menu_page_24_heading_1:0 "§YBreaking an alliance in war§!"
 gecko_menu_page_24_body_1:0 "The stability hit is §R5§!. Annul Treaties lasts §Y20 years§!. Standard peace costs include §Y5 war score§! for war reparations and\nannulment, and §Y30§! for humiliating a rival."
 gecko_menu_page_24_heading_2:0 "§YClaims and diplomats§!"
 gecko_menu_page_24_body_2:0 "Fabricating a claim starts at §Y10 spy-network points§!, with a §Y0.25 per-claim cost modifier§!. Rival changes use a §Y5-year§!\ninterval. These are base rules; national and idea modifiers may alter the final action."
 gecko_menu_page_24_number:0 "Diplomacy & War • 1 / 2"
 gecko_menu_page_25_title:0 "§YOccupation and war preparation§!"
 gecko_menu_page_25_lead:0 "Custom diplomatic actions can reduce repetitive wartime management."
 gecko_menu_page_25_heading_0:0 "§YTransfer occupations in bulk§!"
 gecko_menu_page_25_body_0:0 "The bulk-transfer actions pass eligible occupied enemy provinces between countries fighting on the same side. A\nseparate subject action requests their occupations for the overlord. They change §Ycontrol§!, not province ownership."
 gecko_menu_page_25_heading_1:0 "§YWar Chest§!"
 gecko_menu_page_25_body_1:0 "During Discovery or Reformation, qualifying human non-colonial countries at war can gain §G+5% mercenary\ndiscipline§!. Important requirements include §Y1.25 years of income§! in treasury, no loans, corruption below 1, full\nmaintenance and at least 30% army force-limit usage."
 gecko_menu_page_25_heading_2:0 "§YAdditional eligibility matters§!"
 gecko_menu_page_25_body_2:0 "War Chest also excludes hegemons, tributaries and the top three Great Powers, and applies\nalliance/relative-development conditions. Rising Power bypasses its usual alliance restriction. Saving the treasury\namount alone does not guarantee activation."
 gecko_menu_page_25_number:0 "Diplomacy & War • 2 / 2"
 gecko_menu_page_26_title:0 "§YManaging an empire of subjects§!"
 gecko_menu_page_26_lead:0 "Integration timing and overlord ideas have been changed."
 gecko_menu_page_26_heading_0:0 "§YEarlier integration§!"
 gecko_menu_page_26_body_0:0 "The minimum elapsed time for vassal annexation is §Y5 years§!; personal-union integration starts after §Y10 years§!. These\nelapsed-time thresholds do not waive the other opinion, liberty-desire or diplomatic requirements."
 gecko_menu_page_26_heading_1:0 "§YInfluential overlords§!"
 gecko_menu_page_26_body_1:0 "The Additional Loyalist Recruitment idea grants subjects the Influential Overlord modifier, worth §G+7.5% discipline§!,\nwhile their current overlord has the idea. The system updates on subject/overlord changes rather than granting a\npermanent one-off bonus."
 gecko_menu_page_26_heading_2:0 "§YColour management§!"
 gecko_menu_page_26_body_2:0 "The Manage Subject Colours decision supports eyalets, core eyalets, vassals, marches, client subjects, cantons and\nappanages. It opens the existing colour-management interface; colour changes do not change the subject relationship."
 gecko_menu_page_26_number:0 "Subjects • 1 / 3"
 gecko_menu_page_27_title:0 "§YSpecial subject relationships§!"
 gecko_menu_page_27_lead:0 "Special subjects are governed by their own rules."
 gecko_menu_page_27_heading_0:0 "§YSoutheast Asian tributaries§!"
 gecko_menu_page_27_body_0:0 "Ava, Ayutthaya and Siam have a mission-gated action to elevate a tributary to a vassal. The target must have §Yunder\n300 development§! and §Yunder 50% liberty desire§!. Acceptance is required, and conversion costs §Y50 DIP§!."
 gecko_menu_page_27_heading_1:0 "§YBurgundian subjects and cantons§!"
 gecko_menu_page_27_body_1:0 "Burgundian and canton subject types are defined separately from ordinary vassals. Their diplomatic-slot, integration\nand liberty-desire rules differ. Check the actual subject type before applying a standard-vassal strategy."
 gecko_menu_page_27_heading_2:0 "§YNational subject mechanics§!"
 gecko_menu_page_27_body_2:0 "Eyalets, pronoias, appanages and other national subjects use their own diplomatic actions and mission unlocks.\nTransfer occupations and colour management support some of these types without making their political rules\nidentical."
 gecko_menu_page_27_number:0 "Subjects • 2 / 3"
 gecko_menu_page_28_title:0 "§YMarches and tributary tribute§!"
 gecko_menu_page_28_lead:0 "Subject type can change national ideas and what an overlord receives."
 gecko_menu_page_28_heading_0:0 "§YMarch ideas§!"
 gecko_menu_page_28_body_0:0 "A country becoming a march can adopt the custom March idea set through its one-time transition event. The set\nstarts with §G+25% defensiveness and garrison size§! and finishes with §G+10% infantry combat ability§!. Consider the idea\nchange when promoting a subject."
 gecko_menu_page_28_heading_1:0 "§YTributary payments§!"
 gecko_menu_page_28_body_1:0 "Annual monarch-point tribute has a global maximum of §Y4 points§!. The ordinary cash-tribute base rate is §Y0§!, while\nmanpower tribute uses its own rate. Check which tribute types your current subject relationship can actually provide."
 gecko_menu_page_28_number:0 "Subjects • 3 / 3"
 gecko_menu_page_29_title:0 "§YExplore through the court§!"
 gecko_menu_page_29_lead:0 "Exploration Ideas are disabled; use the custom exploration route."
 gecko_menu_page_29_heading_0:0 "§YPromote colonial expansion§!"
 gecko_menu_page_29_body_0:0 "The court option unlocks at §YDiplomatic Technology 6§! for non-colonial countries and §Y10§! for colonial nations. It\ngrants a permanent modifier with §G2 colonists§!, §G+35 settlers per year§!, extra range and permission to explore."
 gecko_menu_page_29_heading_1:0 "§YHire the right leader§!"
 gecko_menu_page_29_body_1:0 "Explorers and conquistadors come from the Court Recruitment menu and have separate hiring cooldowns. Their\npresence and the colonial-expansion modifier solve different requirements; hiring a leader alone does not grant the\ntwo colonists."
 gecko_menu_page_29_heading_2:0 "§YBlocked provinces§!"
 gecko_menu_page_29_body_2:0 "Some provinces are deliberately unavailable for colonization, while others carry additional colonial penalties. Check\nthe target province before investing in range: reaching an area does not guarantee that every province can be settled."
 gecko_menu_page_29_number:0 "Exploration & Colonies • 1 / 2"
 gecko_menu_page_30_title:0 "§YColonial planning and culture§!"
 gecko_menu_page_30_lead:0 "Check country-specific restrictions before relocating your empire."
 gecko_menu_page_30_heading_0:0 "§YColonial subjects§!"
 gecko_menu_page_30_body_0:0 "Countries whose national setup bars colonial nations cannot create them. Colonial governments and ideas have\ncustom balance, and the colonial expansion court threshold is higher for colonial nations."
 gecko_menu_page_30_heading_1:0 "§YPortugal and the Shogunate§!"
 gecko_menu_page_30_body_1:0 "Portugal cannot move its capital to Africa and is blocked from moving its trade port through the custom action rules.\nThe Shogunate cannot move its capital. Country-specific mission or government mechanics should be checked before\nattempting relocation."
 gecko_menu_page_30_heading_2:0 "§YCultural integration§!"
 gecko_menu_page_30_body_2:0 "Promoting an accepted culture costs a base §Y25 DIP§! and requires §Y5 development§!. Culture conversion uses a base §Y8\nDIP per development§! and §Y5 months per development§!. Separatism starts from a §Y20-year§! base before modifiers."
 gecko_menu_page_30_number:0 "Exploration & Colonies • 2 / 2"
 gecko_menu_page_31_title:0 "§YChoose from the active idea groups§!"
 gecko_menu_page_31_lead:0 "The mod redistributes many vanilla idea-group functions."
 gecko_menu_page_31_heading_0:0 "§YDisabled groups§!"
 gecko_menu_page_31_body_0:0 "§YExploration, Trade, Humanist, Naval, Mercenary, Horde and Indigenous§! groups are disabled in the active\ndefinitions. §YExpansion§! remains available with a rewritten focus; use Court Recruitment for the general exploration\nand colonial-expansion route."
 gecko_menu_page_31_heading_1:0 "§YIdea balance§!"
 gecko_menu_page_31_body_1:0 "Administrative finishes with §G+300 governing capacity§!. Defensive finishes with §G+0.15 military tactics§!, Offensive with\n§G+1 siege pip§!, and Quantity with §G+33% land force limit§! plus special-unit capacity. These replace familiar vanilla\nexpectations."
 gecko_menu_page_31_heading_2:0 "§YGovernment and national ideas§!"
 gecko_menu_page_31_body_2:0 "Government attributes control access to certain political idea groups. National, regional and formable idea sets have\nalso been rewritten; inspect the complete set before forming a country or deciding whether to replace your current\nideas."
 gecko_menu_page_31_number:0 "Ideas & Policies • 1 / 2"
 gecko_menu_page_32_title:0 "§YPolicies and economic synergies§!"
 gecko_menu_page_32_lead:0 "Policy choices can change as technology advances."
 gecko_menu_page_32_heading_0:0 "§YTechnology-gated military policies§!"
 gecko_menu_page_32_body_0:0 "Several policies have mutually exclusive early, middle and late versions, often divided at §YMilitary Technology 15 and\n22§!. Black Chamber uses §Y16 and 22§!. Recheck the policy panel when crossing these thresholds."
 gecko_menu_page_32_heading_1:0 "§YInfrastructure Ideas§!"
 gecko_menu_page_32_body_1:0 "Efficient Construction Plans enhances the tiered building-investment discount. Regulation Bureau strengthens eligible\nproduction hubs. Both benefits depend on the actual buildings and production hubs in each province."
 gecko_menu_page_32_heading_2:0 "§YPolicy and idea limits§!"
 gecko_menu_page_32_body_2:0 "No more than §Y40%§! of selected idea groups may come from one category. Abandoning a group refunds a base §Y10%§! of\ninvested power. Check policy availability and power costs when planning combinations."
 gecko_menu_page_32_number:0 "Ideas & Policies • 2 / 2"
 gecko_menu_page_33_title:0 "§YSmall powers and imperial ambition§!"
 gecko_menu_page_33_lead:0 "Several major triggered bonuses depend on your position and diplomacy."
 gecko_menu_page_33_heading_0:0 "§YRising Power§!"
 gecko_menu_page_33_body_0:0 "Human non-colonial countries below §Y400 own and non-tributary subject development§! can qualify. The Emperor is\nexcluded; a country must be in the HRE or not a Great Power. Benefits include cheaper advisors, mercenaries and\nforts, plus reduced aggressive expansion."
 gecko_menu_page_33_heading_1:0 "§YImperial Ambition§!"
 gecko_menu_page_33_body_1:0 "Qualifying non-Great-Power, non-hegemon, non-colonial countries with current institutions gain manpower\nrecovery, cheaper reinforcements and forts, and mercenary capacity. Normally you may have no human ally and at\nmost one AI ally; Rising Power and the listed regional modifiers bypass that alliance check."
 gecko_menu_page_33_heading_2:0 "§YImperial Dominance§!"
 gecko_menu_page_33_body_2:0 "The qualifying top three Great Powers can receive §G-0.5 percentage points§! yearly army- and navy-tradition decay,\nsubject to institution, alliance and hegemon restrictions. This triggered modifier is separate from the Imperial\nAdministration event bonus."
 gecko_menu_page_33_number:0 "Powers & Reforms • 1 / 3"
 gecko_menu_page_34_title:0 "§YNational and late-game administration§!"
 gecko_menu_page_34_lead:0 "Do not assume the old README's timers apply to these systems."
 gecko_menu_page_34_heading_0:0 "§YImperial Administration§!"
 gecko_menu_page_34_body_0:0 "After the Age of Discovery, the qualifying #1 Great Power below §Y101% governing-capacity use§! can receive §G+400\ngoverning capacity and +1 accepted culture§! through an event with a 1-month mean time. There is no scripted\nrequirement to hold Imperial Dominance continuously for 10 years."
 gecko_menu_page_34_heading_1:0 "§YLosing standing§!"
 gecko_menu_page_34_body_1:0 "The follow-up administration event can replace the large bonus with §G+200 capacity and +1 accepted culture§! at the\nlower Great-Power-rank condition. These are scripted event modifiers, distinct from the live Great-Power tradition\nbonus."
 gecko_menu_page_34_heading_2:0 "§YHegemony§!"
 gecko_menu_page_34_body_2:0 "Economic, naval and military hegemony have separate thresholds and national exceptions. Normally economic\nhegemony needs §Y1,000 monthly income§! and military hegemony §Y1,000 regiments§!, plus comparative Great-Power\nrequirements. Check the active hegemony tooltip rather than relying on a single universal target."
 gecko_menu_page_34_number:0 "Powers & Reforms • 2 / 3"
 gecko_menu_page_35_title:0 "§YHordes, militarization and national paths§!"
 gecko_menu_page_35_lead:0 "National governments can replace generic assumptions."
 gecko_menu_page_35_heading_0:0 "§YEarly steppe support§!"
 gecko_menu_page_35_body_0:0 "Human Sunni and Tengri nomads receive separate Steppe Rule modifiers at startup during Discovery. Both grant\nunity and movement benefits; their cavalry-ratio bonuses differ. These modifiers are removed when Discovery ends,\nso plan for the loss of temporary support."
 gecko_menu_page_35_heading_1:0 "§YHorde government is not a razing unlock§!"
 gecko_menu_page_35_body_1:0 "The active Steppe Horde reform does not enable razing, and horde unity has ongoing base and development-scaled\ndecay. Formables such as the Great Mongol State and Tatar states have distinct reforms; evaluate their actual route\ninstead of assuming a permanent 100-unity opening."
 gecko_menu_page_35_heading_2:0 "§YOther national systems§!"
 gecko_menu_page_35_body_2:0 "Prussian militarization has multiple mission-unlocked tiers. Its boost spends §Y50 MIL§! for §G10 militarization§!.\nHungarian, Mughal, French and other reforms have national or historical-reform prerequisites; mission previews help\nreveal alternative paths."
 gecko_menu_page_35_number:0 "Powers & Reforms • 3 / 3"
 gecko_menu_page_36_title:0 "§YReligion balance§!"
 gecko_menu_page_36_lead:0 "Faith mechanics and modifiers have been revised across the map."
 gecko_menu_page_36_heading_0:0 "§YTolerance and conversion§!"
 gecko_menu_page_36_body_0:0 "Base maximum tolerance of both heretics and heathens is §Y5§!. Conversion zeal lasts §Y1,825 days§! (5 years). Religious\nIdeas also affect culture-conversion cost and time; faith decisions and national missions can add further exceptions."
 gecko_menu_page_36_heading_1:0 "§YRebalanced faith identities§!"
 gecko_menu_page_36_body_1:0 "Sunni adds manpower, Shiite adds army morale, and Ibadi adds goods produced. Christian branches, Buddhist\nschools, Shinto and other faiths also use the mod's own bonuses. Compare the actual religion screen rather than\nassuming the vanilla reward package."
 gecko_menu_page_36_heading_2:0 "§YPiety and personal faith tools§!"
 gecko_menu_page_36_body_2:0 "Declaring the usual good/bad religious wars does not move piety through the ordinary declaration-of-war rules, and\nnew rulers retain the full piety percentage. Church aspects, icons, fervor, deities and blessings have their own revised\noptions and eligibility."
 gecko_menu_page_36_number:0 "Religion • 1 / 2"
 gecko_menu_page_37_title:0 "§YMandate and religious institutions§!"
 gecko_menu_page_37_lead:0 "Use government and religion screens together."
 gecko_menu_page_37_heading_0:0 "§YMandate§!"
 gecko_menu_page_37_body_0:0 "Celestial reforms require and cost §Y75 Mandate§!, without the ordinary reform stability cost. Prosperity, devastation,\ntributary development, loans and stability all affect mandate; high devastation and debt remain especially dangerous."
 gecko_menu_page_37_heading_1:0 "§YMeritocracy and national reforms§!"
 gecko_menu_page_37_body_1:0 "The scripted Mandate-meritocracy setup enables the existing meritocracy reform and sets meritocracy to §Y100§! when\nthe required DLC and Emperor-of-China conditions hold. Tatar and other national reforms can change how imperial\nmechanics fit your government."
 gecko_menu_page_37_heading_2:0 "§YHoly sites and national missions§!"
 gecko_menu_page_37_body_2:0 "Strategic religious provinces and national missions can add missionaries, religious modifiers or special government\naccess. Their activation conditions may require a particular religion, ownership or control. Use the current province\nand mission tooltips for these contextual rewards."
 gecko_menu_page_37_number:0 "Religion • 2 / 2"
 gecko_menu_actions_title:0 "§YActions§!"
 gecko_menu_actions_empty:0 "No actions available yet."
 gecko_menu_country_information_title:0 "§YCountry Information§!"
 gecko_menu_country_information_empty:0 "Country information will be added here."
 gecko_menu_footer:0 "Gecko • Campaign rules and systems"
