 gecko_intscore_docs_annual_cell_3_2:0 "§G+6§!"
 gecko_intscore_docs_annual_cell_3_3:0 "§G+12§!"
 gecko_intscore_docs_annual_example:0 "Example in 1550: 3 Standard + 1 Important = §G10 points per year§!."
 gecko_intscore_docs_annual_note:0 "Each award increases total IntScore and replaces the annual gain display."
 gecko_intscore_docs_annual_note_line_1:0 "Ownership changes affect the next award."
 gecko_intscore_docs_annual_page_number:0 "Section 3 / 6  •  Annual Scoring"
 gecko_intscore_docs_section_wars:0 "IntScore Wars"
 gecko_intscore_docs_wars_title:0 "§YChallenge a player rival§!"
 gecko_intscore_docs_wars_lead:0 "The §YIntScore War§! Casus Belli is available from §Y1500§!."
 gecko_intscore_docs_wars_heading_0:0 "§YWho can fight?§!"
 gecko_intscore_docs_wars_body_0:0 "Both countries must be independent, non-colonial human players. The target must be your rival, with no truce"
 gecko_intscore_docs_wars_body_0_line_1:0 "between you."
 gecko_intscore_docs_wars_heading_1:0 "§YShow Superiority§!"
 gecko_intscore_docs_wars_body_1:0 "Win battles to fulfil §YShow Superiority§!. Battles grant no IntScore directly."
 gecko_intscore_docs_wars_heading_2:0 "§YPeace terms§!"
 gecko_intscore_docs_wars_body_2:0 "Either side can demand IntScore losses at §Y25 / 50 / 75 / 100§! war score. The attacker is limited to these"
 gecko_intscore_docs_wars_body_2_line_1:0 "demands; a victorious defender may also demand provinces. The victor gains §Yno IntScore§!."
 gecko_intscore_docs_wars_page_number:0 "Section 4 / 6  •  IntScore Wars"
