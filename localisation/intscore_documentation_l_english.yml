 gecko_intscore_docs_title:0 "Documentation"
 gecko_intscore_docs_subtitle:0 "IntScore • Player's Handbook"
 gecko_intscore_docs_contents:0 "§YContents§!"
 gecko_intscore_docs_help:0 "Choose a section"
 gecko_intscore_docs_help_line_1:0 "or use Previous"
 gecko_intscore_docs_help_line_2:0 "and Next."
 gecko_intscore_docs_section_overview:0 "Overview"
 gecko_intscore_docs_overview_title:0 "§YA score for your campaign§!"
 gecko_intscore_docs_overview_lead:0 "Earn IntScore through Victory Provinces and protect it in rivalry wars."
 gecko_intscore_docs_overview_heading_0:0 "§YWho takes part?§!"
 gecko_intscore_docs_overview_body_0:0 "Countries that have been player-controlled earn annual points. Colonial nations are excluded; AI control or"
 gecko_intscore_docs_overview_body_0_line_1:0 "subject status alone does not stop scoring."
 gecko_intscore_docs_overview_heading_1:0 "§YYour IntScore§!"
 gecko_intscore_docs_overview_body_1:0 "§YIntScore§! is your accumulated total. §YAnnual gain§! shows the income awarded in the latest January calculation."
 gecko_intscore_docs_overview_heading_2:0 "§YKeeping your points§!"
 gecko_intscore_docs_overview_body_2:0 "Start at §Y0§!. Losing a Victory Province reduces future income, not points already earned. IntScore War demands"
 gecko_intscore_docs_overview_body_2_line_1:0 "reduce your total."
 gecko_intscore_docs_overview_page_number:0 "Section 1 / 6  •  Overview"
 gecko_intscore_docs_section_provinces:0 "Provinces"
 gecko_intscore_docs_provinces_title:0 "§YVictory Provinces§!"
 gecko_intscore_docs_provinces_lead:0 "Victory Provinces generate annual points for their owner or overlord."
 gecko_intscore_docs_provinces_heading_0:0 "§YStandard Victory Provinces§!  —  91"
 gecko_intscore_docs_provinces_body_0:0 "Base value: §G1 point§! × the period multiplier. Shown in gold."
 gecko_intscore_docs_provinces_heading_1:0 "§RImportant Victory Provinces§!  —  17"
 gecko_intscore_docs_provinces_body_1:0 "Base value: §G2 points§! × the period multiplier. Shown in red."
 gecko_intscore_docs_provinces_heading_2:0 "§YOwnership and the atlas§!"
 gecko_intscore_docs_provinces_body_2:0 "Your provinces and those owned by your subjects count, including colonial subjects. Occupation alone does"
 gecko_intscore_docs_provinces_body_2_line_1:0 "not count. Open Victory Provinces to locate a target. Select a marker, click Go to, then use the navigation"
 gecko_intscore_docs_provinces_body_2_line_2:0 "event's native Go to button."
 gecko_intscore_docs_provinces_page_number:0 "Section 2 / 6  •  Provinces"
 gecko_intscore_docs_section_annual:0 "Annual Scoring"
 gecko_intscore_docs_annual_title:0 "§YThe annual award§!"
 gecko_intscore_docs_annual_lead:0 "Awarded once in §YJanuary§!, based on current ownership."
 gecko_intscore_docs_annual_formula:0 "§YAnnual gain = (Standard + 2 × Important) × period multiplier§!"
 gecko_intscore_docs_annual_col_0:0 "§YPeriod§!"
 gecko_intscore_docs_annual_col_1:0 "§YMultiplier§!"
 gecko_intscore_docs_annual_col_2:0 "§YStandard§!"
