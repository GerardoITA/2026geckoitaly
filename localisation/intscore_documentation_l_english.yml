 gecko_intscore_docs_annual_cell_2_0:0 "1600-1699"
 gecko_intscore_docs_annual_cell_2_1:0 "×4"
 gecko_intscore_docs_annual_cell_2_2:0 "§G+4§!"
 gecko_intscore_docs_annual_cell_2_3:0 "§G+8§!"
 gecko_intscore_docs_annual_cell_3_0:0 "1700 onward"
